  .acc-memo-btns { display:flex; gap:10px; }
  .acc-memo-cancel { flex:1; background:#333; border:none; border-radius:10px; color:#fff; font-size:15px; padding:13px; cursor:pointer; }
  .acc-memo-save { flex:1; background:#fff; border:none; border-radius:10px; color:#000; font-size:15px; font-weight:600; padding:13px; cursor:pointer; }

  .header-title { font-size:17px; font-weight:600; margin-left:4px; }

  /* 월 선택 */
  .month-label-btn { background:none; border:none; padding:4px 20px 14px; display:flex; align-items:center; gap:6px; cursor:pointer; width:100%; }
  .month-label-btn .label-text { font-size:15px; font-weight:600; color:#fff; }
  .month-label-btn .label-arrow { font-size:10px; color:#555; }

  /* 총 자산 */
  .total-card { margin:0 20px 20px; background:#242424; border-radius:16px; padding:20px; }
  .tac-label  { font-size:13px; color:#888; margin-bottom:6px; }
  .tac-amount { font-size:26px; font-weight:700; color:#fff; letter-spacing:-0.3px; white-space:nowrap; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}
  .tac-sub    { font-size:13px; color:#666; margin-top:4px; }

  /* 카테고리 탭 */
  .cat-tabs { display:flex; flex-wrap:wrap; gap:8px; padding:0 20px 16px; }
  .cat-tab { background:#242424; border:2px solid transparent; border-radius:20px; color:#888; font-size:13px; font-weight:500; padding:7px 14px; cursor:pointer; white-space:nowrap; transition:all 0.15s; }
  .cat-tab.active { border-color:#007aff; color:#007aff; background:rgba(0,122,255,0.08); }
  .cat-tab[data-cat="all"] { display:block !important; }
  .cat-tab:not([data-cat="all"]):not(.active):not(.show-all) { display:none; }
  .cat-tab.show-all { display:block; }
  .arrow-icon { font-size:10px; color:#555; margin-left:2px; transition:transform 0.2s; }
  .cat-tab.active .arrow-icon { color:#007aff; }
  .cat-tab.expanded .arrow-icon { transform:rotate(180deg); }

  /* 카테고리 선택 버튼 */
  .cat-select-btn { width:100%; background:#2e2e2e; border:2px solid transparent; border-radius:12px; color:#aaa; font-size:15px; font-weight:500; padding:14px; cursor:pointer; text-align:left; transition:all 0.15s; }
  .cat-select-btn.active { border-color:#007aff; color:#007aff; background:rgba(0,122,255,0.08); }

  /* 섹션 */
  .section-header { display:flex; align-items:center; justify-content:space-between; padding:20px 20px 8px; }
  .section-title { font-size:13px; color:#888; font-weight:500; }
  .section-total { font-size:13px; color:#888; }
  .section-total-inline { font-size:26px; font-weight:700; color:#fff; letter-spacing:-0.3px; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}

  /* 계좌 아이템 */
  .account-list { padding:0 20px; }

  .account-item:last-child { border-bottom:none; }
  .account-item:active { opacity:0.6; }
  .acc-icon { width:40px; height:40px; border-radius:10px; margin-right:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; letter-spacing:-0.3px; color:#fff; }
  .acc-icon.long { font-size:9px; }
  .acc-icon.extra-long { font-size:7.5px; }
  .ic-toss      { background:#0064ff22; }
  .ic-kakao     { background:#fee50022; }
  .ic-kb        { background:#f5c51822; }
  .ic-shinhan   { background:#0046a022; }
  .ic-woori     { background:#007b4022; }
  .ic-ibk       { background:#005bac22; }
  .ic-nh        { background:#00843422; }
  .ic-hana      { background:#00854922; }
  .ic-post      { background:#e0001822; }
  .ic-sc        { background:#1428a022; }
  .ic-securities{ background:#6c3fb522; }
  .ic-pension   { background:#d9772022; }
  .ic-savings   { background:#2563eb22; }
  .ic-crypto    { background:#f7931a22; }
  .acc-info { flex:1; min-width:0; }

  .acc-input-btn { flex-shrink:0; margin-left:12px; background:#2e2e2e; border:1px solid #3a3a3a; border-radius:8px; color:#aaa; font-size:13px; font-weight:500; padding:6px 14px; pointer-events:none; white-space:nowrap; }
  .empty-section { text-align:center; padding:40px 0; color:#444; font-size:14px; }

  /* 하단 */

  .nav-btn { width:100%; background:#2e2e2e; border:none; border-radius:12px; color:#fff; font-size:14px; font-weight:500; padding:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .nav-btn:active { background:#383838; }

  /* 월 선택 시트 */
  .sheet-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:600; align-items:flex-end; }
  .sheet-overlay.active { display:flex; }
  .sheet-inner { background:#242424; border-radius:24px 24px 0 0; width:100%; max-height:80vh; overflow-y:auto; padding:20px 20px 86px; animation:slideUp 0.25s ease; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; transition:transform 0.2s ease; }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .sheet-handle { width:36px; height:4px; background:#444; border-radius:2px; margin:0 auto 20px; }
  .sheet-title  { font-size:16px; font-weight:700; margin-bottom:20px; }
  .year-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .year-nav { background:#333; border:none; color:#fff; font-size:18px; width:36px; height:36px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .year-nav:disabled { color:#444; cursor:default; }
  .year-lbl { font-size:16px; font-weight:600; }
  .month-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .m-chip { background:#333; border:2px solid transparent; border-radius:10px; color:#aaa; font-size:14px; padding:11px 0; cursor:pointer; text-align:center; transition:all 0.15s; line-height:1.4; }
  .m-chip.sel { border-color:#007aff; color:#007aff; background:rgba(0,122,255,0.1); font-weight:600; }
  .m-chip.future { color:#333; pointer-events:none; }
  .m-dot { font-size:8px; color:#555; margin-top:2px; }
  .m-chip.sel .m-dot { color:#4da3ff; }

  /* 편집 모달 */
  .fs-overlay-legacy { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:400; align-items:flex-end; }
  .fs-overlay-legacy.active { display:flex; }
  .fs-body-legacy { background:#2e2e2e; border-radius:24px 24px 0 0; width:100%; max-height:85vh; overflow-y:auto; padding:20px 20px 86px; animation:slideUp 0.28s ease; transition:transform 0.2s ease; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .modal-handle { width:36px; height:4px; background:#444; border-radius:2px; margin:0 auto 20px; cursor:grab; }
  .modal-handle:active { cursor:grabbing; }
    .modal-title { font-size:17px; font-weight:700; margin-bottom:20px; color:#fff; }
    .edit-list { display:flex; flex-direction:column; gap:10px; margin-bottom:4px; }
  .edit-item { background:#2e2e2e; border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .ei-info { flex:1; min-width:0; }
  .ei-name { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ei-sub  { font-size:12px; color:#666; margin-top:2px; }
  .ei-actions { display:flex; gap:8px; flex-shrink:0; }
  .btn-ea { background:#3a3a3a; border:none; border-radius:8px; color:#ccc; font-size:12px; padding:6px 10px; cursor:pointer; }
  .btn-ea.del { color:#ff6b6b; }
  .btn-add-acc { margin-top:16px; width:100%; background:#007aff; border:none; border-radius:14px; color:#fff; font-size:15px; font-weight:600; padding:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .edit-cat-label { font-size:12px; color:#555; padding:8px 0 4px; border-top:1px solid #2a2a2a; margin-top:4px; }

  .add-form { display:flex; flex-direction:column; gap:14px; }
  .f-label { font-size:13px; color:#888; margin-bottom:4px; }
  .f-input { width:100%; background:#2e2e2e; border:1px solid #3a3a3a; border-radius:10px; color:#fff; font-size:15px; padding:13px 14px; outline:none; -webkit-appearance:none; }

  .f-row { display:flex; flex-direction:column; gap:4px; }
  .type-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .type-btn { background:#2e2e2e; border:2px solid transparent; border-radius:10px; color:#aaa; font-size:13px; padding:10px 4px; cursor:pointer; text-align:center; transition:all 0.15s; }
  .type-btn.active { border-color:#007aff; color:#007aff; background:rgba(0,122,255,0.08); }
  .btn-submit { margin-top:4px; width:100%; background:#007aff; border:none; border-radius:14px; color:#fff; font-size:15px; font-weight:600; padding:16px; cursor:pointer; }
  .btn-cancel { width:100%; background:#333; border:none; border-radius:14px; color:#aaa; font-size:15px; padding:14px; cursor:pointer; margin-top:6px; }

  /* 월별 잔액 일괄 입력 */
  .bulk-edit-hint { margin:0 20px 16px; background:#242424; border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:10px; }
  .beh-icon { font-size:20px; }
  .beh-text { font-size:13px; color:#888; line-height:1.5; }
  .beh-text strong { color:#fff; }

  .month-trash-btn { background:none; border:none; color:#555; font-size:18px; cursor:pointer; padding:4px 8px; line-height:1; transition:color 0.15s; display:flex; align-items:center; justify-content:center; }
  .month-trash-btn:active { color:#888; }
  .trash-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:500; align-items:center; justify-content:center; padding:0 24px; }
  .trash-overlay.active { display:flex; }
  .trash-sheet { background:#1e1e1e; border-radius:20px; width:100%; max-width:340px; padding:28px 24px 20px; animation:popIn 0.2s ease; }
  @keyframes popIn { from{transform:scale(0.92);opacity:0} to{transform:scale(1);opacity:1} }
  .trs-icon  { font-size:34px; text-align:center; margin-bottom:12px; }
  .trs-title { font-size:17px; font-weight:700; text-align:center; margin-bottom:8px; }

  .trs-btns  { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .trs-cancel  { background:#2a2a2a; border:none; border-radius:12px; color:#aaa; font-size:15px; padding:14px; cursor:pointer; }
  .trs-confirm { background:#f8717122; border:2px solid #f87171; border-radius:12px; color:#f87171; font-size:15px; font-weight:700; padding:14px; cursor:pointer; }

  /* ── 풀스크린 편집 ── */
  .fs-overlay {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: #1a1a1a;
    transform: translateY(100%);
    transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .fs-overlay.active {
    display: block;
    transform: translateY(0);
  }
  .fs-header {
    display: flex; align-items: center; justify-content: center;
    padding: 16px 20px 12px;
    position: sticky; top: 0; background: #1a1a1a; z-index: 10;
    border-bottom: 0.5px solid #2a2a2a;
  }
  .fs-title {
    font-size: 15px; font-weight: 600; color: #fff;
    font-family: -apple-system, sans-serif;
    flex: 1; text-align: center;
  }
  .fs-body { padding: 20px 20px 100px; }
  /* 추가/저장 버튼 */
  .btn-add, .btn-add-acc, .btn-add-card, .btn-submit {
    background: #007aff !important; color: #fff !important;
    border: none; border-radius: 14px;
    font-size: 15px; font-weight: 600; padding: 16px;

    font-family: -apple-system, sans-serif;
  }

  /* 취소 버튼 */

<div class="header">
  <button class="back-btn" onclick="history.back()">‹</button>

/* ══════════════════════════════════════
   데이터 구조
   pk('af_accounts')         : [{id, cat, name, bank, icon, iconCls, yieldPct}]  ← 잔액 없음
   pk('af_accounts_history') : {"YYYY-MM": {id: balance, ...}}
   pk('af_accounts_cashflow'): {"YYYY-MM": {id: amount, ...}}  ← 증권/연금 월별 입출금
   - cashflow: 양수(입금), 음수(출금)
══════════════════════════════════════ */
const DEFAULT_ACCOUNTS = [];

function loadAccounts(){
  try{const s=localStorage.getItem(pk('af_accounts')); return s?JSON.parse(s):DEFAULT_ACCOUNTS;} catch{return DEFAULT_ACCOUNTS;}
}
function saveAccounts(d){ localStorage.setItem(pk('af_accounts'),JSON.stringify(d)); }

function loadHistory(){
  try{const s=localStorage.getItem(pk('af_accounts_history')); return s?JSON.parse(s):{};} catch{return {};}
}
function saveHistory(d){ localStorage.setItem(pk('af_accounts_history'),JSON.stringify(d)); }

function loadCashflow(){
  try{const s=localStorage.getItem(pk('af_accounts_cashflow')); return s?JSON.parse(s):{};} catch{return {};}
}
function saveCashflow(d){ localStorage.setItem(pk('af_accounts_cashflow'),JSON.stringify(d)); }

function loadHidden(){
  try{const s=localStorage.getItem(pk('af_accounts_hidden')); return s?JSON.parse(s):{};} catch{return {};}
}
function saveHidden(d){ localStorage.setItem(pk('af_accounts_hidden'),JSON.stringify(d)); }

// 기존 balance 값 → 현재 달 히스토리로 자동 이전
function migrateOldBalance(){
  const raw = localStorage.getItem(pk('af_accounts'));
  if(!raw) return;
  const list = JSON.parse(raw);
  if(!list.length || list[0].balance == null) return; // 이미 이전됨
  const hist = loadHistory();
  const mk = monthKey(CUR_YEAR, CUR_MONTH);
  if(!hist[mk]) hist[mk] = {};
  list.forEach(a=>{ if(a.balance!=null && !hist[mk][a.id]) hist[mk][a.id]=a.balance; });
  saveHistory(hist);
  // balance 필드 제거
  const clean = list.map(({balance, ...rest})=>rest);
  localStorage.setItem(pk('af_accounts'), JSON.stringify(clean));
}

let accounts = [], history = {}, cashflow = {}, hidden = {}, activeCat = 'all';
let selY = CUR_YEAR, selM = CUR_MONTH, sheetY = CUR_YEAR;

function init(){
  migrateOldBalance();
  accounts = loadAccounts();
  history  = loadHistory();
  cashflow = loadCashflow();
  hidden   = loadHidden();
  // 기본 계좌가 없으면 DEFAULT 저장
  if(!localStorage.getItem(pk('af_accounts'))){
    saveAccounts(DEFAULT_ACCOUNTS);
  }
  renderPage();
}

/* ── 현재 선택 월 잔액 가져오기 ── */
function getBalance(accountId){
  const mk = monthKey(selY, selM);
  const h  = history[mk]||{};
  return h[accountId] ?? 0;
}

function fmt(n){ return Math.round(n).toLocaleString('ko-KR')+'원'; }


/* 계좌 항목 탭 → 바로 잔액 입력 */
function quickEdit(id){
  openEditModal();
  // 모달 열린 후 바로 잔액 폼으로
  setTimeout(()=>showBalanceForm(id), 50);
}
/* ── 렌더링 ── */
function renderPage(){
  const mk = monthKey(selY, selM);
  const isCur = selY===CUR_YEAR && selM===CUR_MONTH;
  document.getElementById('monthLabelText').textContent = `${selM}월 계좌 잔고`;
  document.getElementById('tacLabel').textContent = isCur ? '이번 달 계좌 잔고' : `${selY}년 ${selM}월 잔고`;

  const catKeys = activeCat==='all' ? Object.keys(CATS) : [activeCat];
  let totalBalance = 0, totalCount = 0;
  let html = '';

  catKeys.forEach(cat=>{
    const mk = monthKey(selY, selM);
    const hiddenIds = hidden[mk] || [];
    const list = accounts.filter(a=>a.cat===cat && !hiddenIds.includes(a.id));
    if(!list.length) return;
    const sub = list.reduce((s,a)=>s+getBalance(a.id),0);
    totalBalance += sub;
    totalCount   += list.length;
    html += `
      <div class="section-header">
        <div style="display:flex;flex-direction:column;gap:2px">
          <span class="section-title">${CATS[cat].label}</span>
          <span class="section-total-inline">${fmt(sub)}</span>
        </div>
      </div>
      <div class="account-list">
        ${list.map(a=>{
          const bal = getBalance(a.id);
          const isInvest = ['securities','pension','crypto'].includes(a.cat);
          const principal = a.principal || 0;
          
          let gainHtml = '';
          if(isInvest && principal > 0 && bal > 0){
            const gainAmt = bal - principal;
            const gainPct = ((gainAmt / principal) * 100).toFixed(2);
            const gainColor = gainAmt >= 0 ? '#4ade80' : '#f87171';
            const gainSign = gainAmt >= 0 ? '+' : '';
            gainHtml = `<div class="acc-gain" style="color:${gainColor};font-size:12px;margin-top:2px">${gainSign}${gainPct}% (${gainSign}${fmt(Math.abs(gainAmt))})</div>`;
          }
          
          // 이니셜 길이에 따른 폰트 크기 클래스
          const initial = a.initial || a.icon || a.bank.substring(0, 2);
          const color = a.color || '#888888';
          const initialLen = initial.length;
          let sizeClass = '';
          if(initialLen >= 4) sizeClass = 'extra-long';
          else if(initialLen === 3) sizeClass = 'long';
          
          return `
            <div class="account-item" onclick="quickEdit(${a.id})">
              <div class="acc-icon ${sizeClass}" style="background:${color}22;color:${color}">${initial}</div>
              <div class="acc-info">
                <div class="acc-name">${fmt(bal)}</div>
                <div class="acc-sub">${a.name}</div>
                ${gainHtml}
              </div>
              <div class="acc-input-btn">입력</div>
            </div>`;
        }).join('')}
      </div>`;
  });

  if(!html) html = `<div class="empty-section">계좌가 없어요<br><span style="font-size:12px;color:#555">자산 편집하기에서 추가해보세요</span></div>`;
  document.getElementById('accountSections').innerHTML = html;
  document.getElementById('totalAssetAmt').textContent = fmt(totalBalance);
  document.getElementById('totalAssetSub').textContent = `총 ${totalCount}개 계좌`;
}

/* ── 카테고리 탭 선택 ── */
function selectCat(btn){
  const cat = btn.dataset.cat;
  const allBtn = document.querySelector('.cat-tab[data-cat="all"]');
  
  if(cat === 'all'){
    // 전체 클릭: 펼치기/접기 토글
    const isExpanded = allBtn.classList.contains('expanded');
    
    if(isExpanded){
      // 펼쳐져있으면 → 접기
      allBtn.classList.remove('expanded');
      document.querySelectorAll('.cat-tab:not([data-cat="all"])').forEach(b => {
        b.classList.remove('show-all');
      });
    } else {
      // 접혀있으면 → 펼치기
      allBtn.classList.add('expanded');
      document.querySelectorAll('.cat-tab:not([data-cat="all"])').forEach(b => {
        b.classList.add('show-all');
      });
    }
    
    // 전체가 선택되지 않은 상태였다면 활성화
    if(!allBtn.classList.contains('active')){
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      allBtn.classList.add('active');
      activeCat = 'all';
      renderPage();
    }
  } else {
    // 다른 카테고리 선택: 해당 카테고리만 활성화
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = cat;
    renderPage();
    
    // 다른 카테고리 선택 시에도 전체 버튼은 유지 (접힌 상태로)
    allBtn.classList.remove('expanded');
  }
}

/* ── 월 시트 ── */
function openMonthSheet(){ sheetY=selY; renderSheetGrid(); document.getElementById('monthSheet').classList.add('active'); }
function closeMonthSheet(){ document.getElementById('monthSheet').classList.remove('active'); }
function changeYear(d){ sheetY=Math.min(CUR_YEAR,sheetY+d); renderSheetGrid(); }
function renderSheetGrid(){
  document.getElementById('sheetYearLbl').textContent = sheetY+'년';
  document.getElementById('yearPrev').disabled = sheetY<=CUR_YEAR-5;
  document.getElementById('yearNext').disabled = sheetY>=CUR_YEAR;
  document.getElementById('monthGrid').innerHTML = Array.from({length:12},(_,i)=>{
    const m=i+1;
    const future = sheetY===CUR_YEAR && m>CUR_MONTH;
    const isSel  = sheetY===selY && m===selM;
    const hasDot = history[monthKey(sheetY,m)] && Object.values(history[monthKey(sheetY,m)]).some(v=>v>0);
    return `<button class="m-chip ${isSel?'sel':''} ${future?'future':''}" onclick="pickMonth(${m})">${m}월<div class="m-dot">${hasDot?'●':''}</div></button>`;
  }).join('');
}
function pickMonth(m){ selY=sheetY; selM=m; closeMonthSheet(); renderPage(); updateMemoIcon(); }

/* ── 편집 모달 ── */
function openEditModal(){ 
  showEditMain(); 
  document.getElementById('fsOverlay').classList.add('active');
  // iOS body 스크롤 차단
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
  document.body.style.top = `-${window.scrollY}px`;
}
function closeEditModal(){ 
  const overlay = document.getElementById('fsOverlay');
  const sheet = overlay?.querySelector('.fs-body-legacy');
  
  // transform 초기화
  if(sheet){
    sheet.style.transform = 'translateY(0)';
    sheet.style.transition = '';
  }
  
  overlay.classList.remove('active');
  
  // iOS body 스크롤 복원
  const scrollY = document.body.style.top;
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
  document.body.style.top = '';
  window.scrollTo(0, parseInt(scrollY || '0') * -1);
}

function showEditMain(){
  let listHtml = '';
  Object.keys(CATS).forEach(cat=>{
    const list = accounts.filter(a=>a.cat===cat);
    if(!list.length) return;
    listHtml += `<div class="edit-cat-label">${CATS[cat].label}</div>`;
    listHtml += list.map(a=>{
      const initial = a.initial || a.icon || a.bank.substring(0, 2);
      const color = a.color || '#888888';
      const initialLen = initial.length;
      let sizeClass = '';
      if(initialLen >= 4) sizeClass = 'extra-long';
      else if(initialLen === 3) sizeClass = 'long';
      
      return `
      <div class="edit-item">
        <div class="acc-icon ${sizeClass}" style="width:36px;height:36px;margin-right:0;background:${color}22;color:${color}">${initial}</div>
        <div class="ei-info">
          <div class="ei-name">${a.name}</div>

/* 월별 잔고 입력 폼 */
function showBalanceForm(id){
  const a = accounts.find(x=>x.id===id); if(!a) return;
  const cur = getBalance(id);
  const mk = monthKey(selY, selM);
  const curCashflow = (cashflow[mk] && cashflow[mk][id]) || 0;
  
  // 증권/연금/가상화폐 계좌인지 확인
  const isInvestment = ['securities','pension','crypto'].includes(a.cat);
  const principal = a.principal || 0;
  
  let previewHtml = '';
  if(isInvestment && principal > 0 && cur > 0){
    const gainAmt = cur - principal;
    const gainPct = ((gainAmt / principal) * 100).toFixed(2);
    const gainColor = gainAmt >= 0 ? '#4ade80' : '#f87171';
    const gainSign = gainAmt >= 0 ? '+' : '';
    
    previewHtml = `
      <div id="balancePreview" style="margin-top:12px;padding:14px;background:#2e2e2e;border-radius:12px">
        <div style="font-size:12px;color:#888;margin-bottom:8px">💰 수익 미리보기</div>
        <div style="font-size:15px;color:${gainColor};font-weight:600">
          ${gainSign}${gainPct}% (${gainSign}${fmt(Math.abs(gainAmt))})
        </div>
        <div style="font-size:11px;color:#666;margin-top:4px">투자 원금 ${fmt(principal)} 기준</div>
      </div>`;
  } else if(isInvestment && principal === 0){
    previewHtml = `
      <div id="balancePreview" style="margin-top:12px;padding:14px;background:#2e2e2e;border-radius:12px">
        <div style="font-size:12px;color:#666">💡 투자 원금을 입력하면 수익률을 확인할 수 있어요</div>
      </div>`;
  }
  
  document.getElementById('editContent').innerHTML = `
    <div class="modal-title">${a.name}<br><span style="font-size:14px;color:#888;font-weight:400">${selY}년 ${selM}월 잔고 입력</span></div>
    <div class="add-form">
      <div class="f-row">
        <div class="f-label">${selM}월 말 잔고 (원)</div>
        <input class="f-input" id="bInput" type="text" inputmode="numeric" placeholder="0" 
               value="${cur?cur.toLocaleString('ko-KR'):''}" 
               oninput="formatNumberInput(this);updateBalancePreview(${id})">
      </div>
      ${previewHtml}
      ${isInvestment ? `
      <div class="f-row">
        <div class="f-label">${selM}월 입출금 (원) <span style="color:#888;font-size:11px">· 입금(+) / 출금(-)</span></div>
        <input class="f-input" id="cfInput" type="text" inputmode="numeric" placeholder="예) 1000000" value="${curCashflow?curCashflow.toLocaleString('ko-KR'):''}" oninput="formatNumberInput(this)" style="text-align:left">
      </div>
      ` : ''}
      <button class="btn-submit" onclick="saveBalance(${id})">저장하기</button>
      <button class="btn-cancel" onclick="closeEditModal()">취소</button>
    </div>`;
}

function updateBalancePreview(accountId){
  const a = accounts.find(x=>x.id===accountId);
  if(!a) return;
  
  const isInvestment = ['securities','pension','crypto'].includes(a.cat);
  if(!isInvestment) return;
  
  const principal = a.principal || 0;
  if(principal === 0) return;
  
  const balStr = document.getElementById('bInput').value.replace(/,/g,'');
  const bal = parseInt(balStr)||0;
  
  if(bal === 0){
    const preview = document.getElementById('balancePreview');
    if(preview){
      preview.innerHTML = `
        <div style="font-size:12px;color:#888;margin-bottom:8px">💰 수익 미리보기</div>
        <div style="font-size:15px;color:#888;font-weight:600">-</div>
        <div style="font-size:11px;color:#666;margin-top:4px">투자 원금 ${fmt(principal)} 기준</div>`;
    }
    return;
  }
  
  const gainAmt = bal - principal;
  const gainPct = ((gainAmt / principal) * 100).toFixed(2);
  const gainColor = gainAmt >= 0 ? '#4ade80' : '#f87171';
  const gainSign = gainAmt >= 0 ? '+' : '';
  
  const preview = document.getElementById('balancePreview');
  if(preview){
    preview.innerHTML = `
      <div style="font-size:12px;color:#888;margin-bottom:8px">💰 수익 미리보기</div>
      <div style="font-size:15px;color:${gainColor};font-weight:600">
        ${gainSign}${gainPct}% (${gainSign}${fmt(Math.abs(gainAmt))})
      </div>
      <div style="font-size:11px;color:#666;margin-top:4px">투자 원금 ${fmt(principal)} 기준</div>`;
  }
}

function saveBalance(id){
  const balStr = document.getElementById('bInput').value.replace(/,/g,'');
  const bal = parseInt(balStr)||0;
  const cfInput = document.getElementById('cfInput');
  const cf = cfInput ? (parseInt(cfInput.value.replace(/,/g,''))||0) : 0;

  const mk  = monthKey(selY, selM);
  if(!history[mk]) history[mk] = {};
  history[mk][id] = bal;
  saveHistory(history);
  
  // 증권/연금 계좌면 입출금도 저장
  if(cfInput){
    if(!cashflow[mk]) cashflow[mk] = {};
    cashflow[mk][id] = cf;
    saveCashflow(cashflow);
  }

  closeEditModal();
  renderPage();
  showToast(`${selY}년 ${selM}월 잔고가 저장됐어요`);
}

function updateAccount(id){
  const name=document.getElementById('newName').value.trim();
  const bankBtn=document.getElementById('newBank');
  const bank=bankBtn.textContent.trim();
  const initial = bankBtn.dataset.initial || bank.substring(0, 2);
  const color = bankBtn.dataset.color || '#888888';
  const cat=document.querySelector('#typeGrid .type-btn.active')?.dataset.cat||'checking';
  const yieldPct=null;
  if(!name){showToast('계좌명을 입력해주세요.');return;}
  if(!bank || bank==='선택하기'){showToast('은행/증권사를 선택해주세요.');return;}
  
  const idx=accounts.findIndex(x=>x.id===id);
  if(idx===-1) return;
  
  // 기본 필드 업데이트
  accounts[idx]={...accounts[idx],name,bank,cat,yieldPct,initial,color};
  
  // 증권계좌면 추가 필드 업데이트
  if(cat === 'securities'){
    const stockType = document.querySelector('[data-stock].type-btn.active')?.dataset.stock||'domestic';
    const principalInput = document.getElementById('editPrincipal');
    const principal = principalInput ? (parseInt(principalInput.value.replace(/,/g,''))||0) : 0;
    const startDate = document.getElementById('editStartDate')?.value||'';
    
    accounts[idx].stockType = stockType;
    accounts[idx].principal = principal;
    accounts[idx].startDate = startDate;
  }
  
  // 연금·IRP 계좌도 원금/시작일 저장
  if(cat === 'pension'){
    const principalInput = document.getElementById('editPrincipal');
    const principal = principalInput ? (parseInt(principalInput.value.replace(/,/g,''))||0) : 0;
    const startDate = document.getElementById('editStartDate')?.value||'';
    
    accounts[idx].principal = principal;
    accounts[idx].startDate = startDate;
  }
  
  // 가상화폐 계좌도 원금/시작일 저장
  if(cat === 'crypto'){
    const principalInput = document.getElementById('editPrincipal');
    const principal = principalInput ? (parseInt(principalInput.value.replace(/,/g,''))||0) : 0;
    const startDate = document.getElementById('editStartDate')?.value||'';
    
    accounts[idx].principal = principal;
    accounts[idx].startDate = startDate;
  }
  
  saveAccounts(accounts); showEditMain(); renderPage(); showToast('계좌가 저장됐어요');
}

function restoreAccount(id){
  const mk = monthKey(selY, selM);
  if(hidden[mk]) hidden[mk] = hidden[mk].filter(x=>x!==id);
  saveHidden(hidden);
  showEditMain(); renderPage(); showToast('저장됐어요');
}

async function deleteAccount(id){
  const a = accounts.find(x=>x.id===id);
  if(!a) return;
  openTrashModal(
    `"${a.name}" 삭제`,
    `<strong style="color:#fff">${selY}년 ${selM}월만 숨기기</strong><br>다른 달 데이터는 유지돼요.<br><br>또는 <strong style="color:#f87171">모든 월 완전 삭제</strong>를 선택하세요.`,
    ()=>{ // 완전 삭제
      accounts=accounts.filter(x=>Number(x.id)!==Number(id));
      Object.keys(history).forEach(mk=>{ delete history[mk][id]; });
      Object.keys(hidden).forEach(mk=>{ hidden[mk]=hidden[mk].filter(x=>x!==id); });
      saveAccounts(accounts); saveHistory(history); saveHidden(hidden);
      showEditMain(); renderPage(); showToast('저장됐어요');
    },
    ()=>{ // 이번달 숨기기
      const mk = monthKey(selY, selM);
      if(!hidden[mk]) hidden[mk]=[];
      if(!hidden[mk].includes(id)) hidden[mk].push(id);
      saveHidden(hidden);
      showEditMain(); renderPage(); showToast('저장됐어요');
    }
  );
}

  const currentValue = bankBtn.textContent === '선택하기' ? '' : bankBtn.textContent;
  const userInput = prompt('은행/증권사 이름을 입력하세요', currentValue);
  if(userInput !== null && userInput.trim()){
    bankBtn.textContent = userInput.trim();
    bankBtn.style.color = '#fff';
    bankBtn.dataset.initial = userInput.trim().substring(0, 3); // 최대 3글자
    bankBtn.dataset.color = '#888888'; // 기본 회색
  }
  closeBankSheet();
}


/* ── 숫자 콤마 포맷 ── */
function formatNumberInput(input){
  let val = input.value.replace(/,/g, '');
  // 음수 허용 (입출금 필드용)
  if(val && !isNaN(val)){
    input.value = Number(val).toLocaleString('ko-KR');
  }
}

function getPrevMonthKey(y, m){
  let prevY = y;
  let prevM = m - 1;
  if(prevM < 1){
    prevM = 12;
    prevY = y - 1;
  }
  return monthKey(prevY, prevM);
}



/* ── 월별 초기화 ── */
let _trashCb = null, _hideCb = null;
function openTrashModal(title, desc, cb, hideCb){
  document.getElementById('trsTitle').textContent=title;
  document.getElementById('trsDesc').innerHTML=desc;
  _trashCb=cb; _hideCb=hideCb||null;
  // 숨기기 버튼 표시 여부
  const hideBtn = document.getElementById('trsHideBtn');
  if(hideBtn) hideBtn.style.display = _hideCb ? 'block' : 'none';
  document.getElementById('trashOverlay').classList.add('active');
}
function closeTrashModal(){ document.getElementById('trashOverlay').classList.remove('active'); _trashCb=null; _hideCb=null; }
function confirmTrash(){ if(_trashCb)_trashCb(); closeTrashModal(); }
function confirmHide(){ if(_hideCb)_hideCb(); closeTrashModal(); }

function openMonthTrash(){
  const mk = monthKey(selY, selM);
  const hasData = accounts.some(a=>(history[mk]||{})[a.id]>0);
  if(!hasData){ showToast(selM+'월에 입력된 잔고가 없어요.'); return; }
  openTrashModal(
    selM+'월 잔고 초기화',
    `<strong>${selY}년 ${selM}월</strong>에 입력된<br>모든 계좌 잔고가 삭제돼요.`,
    ()=>{
      delete history[monthKey(selY,selM)];
      saveHistory(history);
      renderPage();
    }
  );
}

/* ── 스와이프로 모달 닫기 ── */
// 편집 모달
(function(){
  let startY=0, currentY=0, isDragging=false;
  const overlay = document.getElementById('fsOverlay');
  const sheet   = overlay?.querySelector('.fs-body-legacy');
  const handle  = overlay?.querySelector('.modal-handle');
  if(!handle||!sheet||!overlay) return;

  function onStart(e){
    const touch = e.touches?e.touches[0]:e;
    startY = touch.clientY; currentY = startY; isDragging = true;
    sheet.style.transition = 'none';
  }
  function onMove(e){
    if(!isDragging) return;
    const touch = e.touches?e.touches[0]:e;
    currentY = touch.clientY;
    const diff = currentY - startY;
    if(diff>0) sheet.style.transform = `translateY(${diff}px)`;
  }
  function onEnd(){
    if(!isDragging) return;
    isDragging = false;
    sheet.style.transition = 'transform 0.2s ease';
    const diff = currentY - startY;
    if(diff>100){ closeEditModal(); }
    else{ sheet.style.transform = 'translateY(0)'; }
  }

  handle.addEventListener('touchstart', onStart, {passive:true});
  handle.addEventListener('touchmove',  onMove,  {passive:true});
  handle.addEventListener('touchend',   onEnd,   {passive:true});
  handle.addEventListener('mousedown',  onStart);
  document.addEventListener('mousemove', e=>{ if(isDragging) onMove(e); });
  document.addEventListener('mouseup',   onEnd);
})();

/* ════════ 월별 메모 ════════ */
const MEMO_KEY = 'af_monthly_memos';

function memoMK(y, m) {
  return `${y}-${String(m).padStart(2,'0')}`;
}
function loadMemos() {
  try { return JSON.parse(localStorage.getItem(MEMO_KEY)||'{}'); } catch { return {}; }
}
function updateMemoIcon() {
  const memos = loadMemos();
  const mk = memoMK(selY, selM);
  const btn = document.getElementById('memoIconBtn');
  if (!btn) return;
  if (memos[mk]) btn.classList.add('has-memo');
  else btn.classList.remove('has-memo');
}
function openAccountMemo() {
  const memos = loadMemos();
  const mk = memoMK(selY, selM);
  const now = new Date();
  const isCurrentMonth = (selY === now.getFullYear() && selM === now.getMonth()+1);
  document.getElementById('accMemoTitle').textContent = `${selY}년 ${selM}월 메모`;
  document.getElementById('accMemoTextarea').value = memos[mk] || '';
  document.getElementById('accMemoOverlay').classList.add('active');
  setTimeout(()=>document.getElementById('accMemoTextarea').focus(), 200);
}
function closeAccountMemo() {
  document.getElementById('accMemoOverlay').classList.remove('active');
}
function saveAccountMemo() {
  const text = document.getElementById('accMemoTextarea').value.trim();
  const mk = memoMK(selY, selM);
  const memos = loadMemos();
  if (text) memos[mk] = text;
  else delete memos[mk];
  localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
  closeAccountMemo();
  updateMemoIcon();
}
