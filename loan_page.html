<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>대출 관리 - AssetFlow</title>
<script src="theme.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #1a1a1a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding-bottom: 200px;
  }

  .header {
    display: flex; align-items: center;
    padding: 16px 20px;
    position: sticky; top: 0;
    background: #1a1a1a; z-index: 100;
  }
  .back-btn { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:4px 8px 4px 0; line-height:1; }
  .header-title { font-size:17px; font-weight:600; margin-left:4px; }
  .header-right { margin-left:auto; display:flex; gap:8px; }
  .sort-btn {
    background:#2e2e2e; border:none; border-radius:8px;
    color:#aaa; font-size:12px; padding:6px 10px; cursor:pointer;
  }
  .sort-btn.active { background:#007aff22; color:#007aff; border:1px solid #007aff44; }

  /* 총 대출 요약 */
  .summary-card {
    margin: 4px 20px 20px;
    background: #242424; border-radius: 16px; padding: 20px;
  }
  .sc-label  { font-size:13px; color:#888; margin-bottom:6px; }
  .sc-amount { font-size:26px; font-weight:700; color:#f87171; letter-spacing:-0.3px; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}
  .sc-sub    { font-size:13px; color:#666; margin-top:4px; }
  .sc-monthly { font-size:13px; color:#fb923c; margin-top:6px; font-weight:600; }

  /* 대출 카드 */
  .loan-list { padding: 0 20px; display:flex; flex-direction:column; gap:12px; }
  .loan-card {
    background: #242424; border-radius:16px; padding:18px;
    cursor: pointer; transition: opacity 0.15s; position:relative;
  }
  .loan-card:active { opacity:0.8; }

  /* 만기 임박 배지 */
  .expiry-badge {
    position:absolute; top:14px; right:14px;
    background:#f8717122; color:#f87171;
    font-size:10px; font-weight:700; border-radius:6px;
    padding:3px 7px; border:1px solid #f8717144;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

  .lc-top { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .lc-bank-icon {
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .lc-bank-info { flex:1; min-width:0; }
  .lc-bank-name { font-size:12px; color:#888; margin-bottom:2px; }
  .lc-loan-name { font-size:14px; font-weight:500; color:#eee; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .lc-main { display:flex; align-items:baseline; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .lc-balance { font-size:22px; font-weight:700; color:#f87171; letter-spacing:-0.3px; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}
  .lc-rate    { font-size:15px; font-weight:600; color:#fb923c; }
  .lc-method-badge {
    font-size:11px; color:#888;
    background:#2e2e2e; border-radius:6px; padding:3px 8px;
    align-self:center;
  }

  .lc-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lc-info-label { font-size:11px; color:#666; margin-bottom:3px; }
  .lc-info-value { font-size:13px; font-weight:500; color:#ccc; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}

  .lc-progress-wrap { margin-top:14px; }
  .lc-progress-top  { display:flex; justify-content:space-between; font-size:11px; color:#666; margin-bottom:6px; }
  .lc-progress-bar  { height:4px; background:#333; border-radius:2px; overflow:hidden; }
  .lc-progress-fill { height:100%; background:linear-gradient(90deg,#f87171,#fb923c); border-radius:2px; }

  .lc-interest-day {
    display:inline-flex; align-items:center; gap:6px;
    background:#2e2e2e; border-radius:8px; padding:7px 12px; margin-top:12px; font-size:13px;
  }
  .lc-interest-dot { width:6px; height:6px; border-radius:50%; background:#007aff; flex-shrink:0; }
  .day-label { color:#888; }
  .day-value { color:#fff; font-weight:600; }

  /* 알림 칩 */
  .info-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .info-chip {
    display:inline-flex; align-items:center; gap:5px;
    background:#2e2e2e; border-radius:8px; padding:6px 10px; font-size:12px; color:#aaa;
  }
  .info-chip.warn { background:#f8717115; color:#f87171; border:1px solid #f8717130; }
  .info-chip.blue { background:#007aff15; color:#7db8ff; border:1px solid #007aff30; }
  .info-chip.green { background:#4ade8015; color:#4ade80; border:1px solid #4ade8030; }
  .info-chip.orange { background:#fb923c15; color:#fb923c; border:1px solid #fb923c30; }

  /* 월 납부 계산 결과 박스 */
  .calc-box {
    margin-top:14px; background:#1e1e1e; border-radius:12px; padding:14px 16px;
    border:1px solid #2e2e2e;
  }
  .calc-box-title { font-size:11px; color:#666; margin-bottom:10px; font-weight:600; letter-spacing:0.3px; }
  .calc-row {
    display:flex; justify-content:space-between; align-items:center;
    padding: 5px 0; border-bottom:1px solid #2a2a2a;
  }
  .calc-row:last-child { border-bottom:none; }
  .calc-row-label { font-size:13px; color:#888; }
  .calc-row-value { font-size:13px; font-weight:600; color:#fff; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}
  .calc-row-value.highlight { color:#fb923c; font-size:14px; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}
  .calc-row-value.red  { color:#f87171; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}
  .calc-row-value.green{ color:#4ade80; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}
  .calc-notice { font-size:11px; color:#555; margin-top:8px; line-height:1.5; }

  .empty-state { text-align:center; padding:60px 0 32px; color:#444; }
  .empty-icon  { font-size:40px; margin-bottom:12px; }
  .empty-text  { font-size:14px; line-height:1.6; }

  /* 하단 버튼 */
  .bottom-nav { position:fixed; bottom:70px; left:0; right:0;
    background:rgba(26,26,26,0.97); backdrop-filter:blur(10px);
    padding:12px 20px 28px;
  }
  .nav-btn {
    width:100%; background:#2e2e2e; border:none; border-radius:12px;
    color:#fff; font-size:14px; font-weight:500; padding:14px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .nav-btn:active { background:#383838; }

  /* 편집 모달 */
  .fs-overlay-legacy {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.75); z-index:400; align-items:flex-end;
  }
  .fs-overlay-legacy.active { display:flex; }
  .fs-body-legacy {
    background:#242424; border-radius:24px 24px 0 0;
    width:100%; max-height:92vh; overflow-y:auto;
    padding:20px 20px 86px; animation:slideUp 0.28s ease;
  }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal-handle { width:36px; height:4px; background:#444; border-radius:2px; margin:0 auto 20px; cursor:grab; }
  .modal-handle:active { cursor:grabbing; }
    .modal-title { font-size:17px; font-weight:700; margin-bottom:20px; color:#fff; }

    .edit-list { display:flex; flex-direction:column; gap:10px; margin-bottom:4px; }
  .edit-item {
    background:#2e2e2e; border-radius:14px;
    padding:14px 16px; display:flex; align-items:center; gap:12px;
  }
  .ei-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .ei-info { flex:1; min-width:0; }
  .ei-name { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ei-sub  { font-size:12px; color:#666; margin-top:2px; }
  .ei-actions { display:flex; gap:8px; flex-shrink:0; }
  .btn-ea { background:#3a3a3a; border:none; border-radius:8px; color:#ccc; font-size:12px; padding:6px 10px; cursor:pointer; }
  .btn-ea.del { color:#ff6b6b; }

  .btn-add {
    margin-top:16px; width:100%;
    background:#007aff; border:none; border-radius:14px;
    color:#fff; font-size:15px; font-weight:600; padding:16px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }

  .add-form { display:flex; flex-direction:column; gap:14px; }
  .f-label  { font-size:13px; color:#888; margin-bottom:4px; }
  .f-input  {
    width:100%; background:#2e2e2e; border:1px solid #3a3a3a;
    border-radius:10px; color:#fff; font-size:15px;
    padding:13px 14px; outline:none; transition:border-color 0.2s;
    -webkit-appearance:none;
  }
  .f-input:focus { border-color:#007aff; }
  .f-input:read-only { color:#888; background:#252525; cursor:default; }
  .f-row   { display:flex; flex-direction:column; gap:4px; }
  .f-row-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .sel-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .sel-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .sel-grid-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; }
  .sel-grid-5 { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .sel-grid-6 { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .type-btn {
    background:#2e2e2e; border:2px solid transparent;
    border-radius:10px; color:#aaa; font-size:13px;
    padding:10px 4px; cursor:pointer; text-align:center; transition:all 0.15s; line-height:1.3;
  }
  .type-btn.active { border-color:#007aff; color:#007aff; background:rgba(0,122,255,0.08); }

  .calc-preview {
    background:#1e1e1e; border:1px solid #2e2e2e; border-radius:12px; padding:14px;
  }
  .cp-title { font-size:12px; color:#555; margin-bottom:10px; font-weight:600; }
  .cp-row   { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #2a2a2a; }
  .cp-row:last-child { border-bottom:none; }
  .cp-label { font-size:13px; color:#888; }
  .cp-value { font-size:13px; font-weight:600; color:#fff; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}
  .cp-value.orange { color:#fb923c; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}
  .cp-value.red    { color:#f87171; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}

  .form-section-label {
    font-size:12px; color:#555; font-weight:600; letter-spacing:0.5px;
    padding:6px 0 2px; border-top:1px solid #333; margin-top:2px;
  }
  .form-section-label:first-child { border-top:none; margin-top:0; }

  .btn-submit {
    margin-top:8px; width:100%;
    background:#007aff; border:none; border-radius:14px;
    color:#fff; font-size:15px; font-weight:600; padding:16px; cursor:pointer;
  }
  .btn-cancel {
    width:100%; background:#333; border:none; border-radius:14px;
    color:#aaa; font-size:15px; padding:14px; cursor:pointer; margin-top:6px;
  }

  .method-desc { font-size:12px; color:#555; padding:6px 0 0; line-height:1.5; }
  .field-note  { font-size:11px; color:#555; margin-top:4px; line-height:1.5; }

  /* ── 풀스크린 편집 ── */
  .fs-overlay {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: #1a1a1a;
    transform: translateY(100%);
    transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .fs-overlay.active {
    display: block;
    transform: translateY(0);
  }
  .fs-header {
    display: flex; align-items: center; justify-content: center;
    padding: 16px 20px 12px;
    position: sticky; top: 0; background: #1a1a1a; z-index: 10;
    border-bottom: 0.5px solid #2a2a2a;
  }
  .fs-title {
    font-size: 15px; font-weight: 600; color: #fff;
    font-family: -apple-system, sans-serif;
    flex: 1; text-align: center;
  }
  .fs-body { padding: 20px 20px 100px; }
  /* 추가/저장 버튼 */
  .btn-add, .btn-add-acc, .btn-add-card, .btn-submit {
    background: #007aff !important; color: #fff !important;
    border: none; border-radius: 14px;
    font-size: 15px; font-weight: 600; padding: 16px;
    cursor: pointer; width: 100%; margin-top: 8px;
    font-family: -apple-system, sans-serif;
  }
  .btn-add:active, .btn-add-acc:active, .btn-add-card:active, .btn-submit:active {
    opacity: 0.85;
  }
  /* 취소 버튼 */
  .btn-cancel, .btn-cancel-half {
    background: #2e2e2e !important; color: #888 !important;
    border: none; border-radius: 14px;
    font-size: 15px; padding: 14px;
    cursor: pointer; width: 100%; margin-top: 6px;
    font-family: -apple-system, sans-serif;
  }


  /* ── 바텀탭 ── */
  .bottom-tab-bar {
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(20,20,20,0.97);
    border-top:1px solid #2a2a2a;
    display:flex; padding:10px 0 28px;
    z-index:200;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .tab-item {
    flex:1; display:flex; flex-direction:column;
    align-items:center; gap:3px;
    cursor:pointer; padding:4px 0;
    background:none; border:none; color:inherit;
  }
  .tab-item-label { font-size:12px; color:#555; font-weight:500; letter-spacing:-0.2px; }
  .tab-item.active .tab-item-label { color:#fff; }
  .tab-item-dot { width:4px; height:4px; border-radius:50%; background:transparent; margin-bottom:1px; }
  .tab-item.active .tab-item-dot { background:#fff; }

  .more-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; display:none; align-items:flex-end; }
  .more-overlay.active { display:flex; }
  .more-sheet { background:#1a1a1a; border-radius:20px 20px 0 0; width:100%; padding:20px 20px 36px; }
  .more-handle { width:40px; height:4px; background:#333; border-radius:2px; margin:0 auto 18px; }
  .more-sec-title { font-size:11px; color:#555; font-weight:600; letter-spacing:0.05em; padding:0 2px 10px; }
  .more-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
  .more-grid-item {
    background:#242424; border-radius:10px;
    padding:12px 6px; text-align:center;
    font-size:13px; font-weight:500; color:#ddd;
    cursor:pointer; border:none;
    font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;
  }
  .more-grid-item:active { background:#2e2e2e; color:#fff; }


  /* ── 바텀탭 ── */
  .bottom-tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(15,15,15,0.98);
    border-top: 1px solid #222;
    display: flex; padding: 10px 0 28px;
    z-index: 1500;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    cursor: pointer; padding: 4px 0;
    background: none; border: none; color: inherit;
  }
  .tab-item-label { font-size: 12px; color: #555; font-weight: 500; letter-spacing: -0.2px; }
  .tab-item.active .tab-item-label { color: #fff; }
  .tab-item-dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; margin-bottom: 1px; }
  .tab-item.active .tab-item-dot { background: #fff; }
  .more-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; display:none; align-items:flex-end; }
  .more-overlay.active { display:flex; }
  .more-sheet { background:#1a1a1a; border-radius:20px 20px 0 0; width:100%; padding:20px 20px 36px; }
  .more-handle { width:40px; height:4px; background:#333; border-radius:2px; margin:0 auto 18px; }
  .more-sec-title { font-size:11px; color:#555; font-weight:600; letter-spacing:0.05em; padding:0 2px 10px; }
  .more-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
  .more-grid-item {
    background:#242424; border-radius:10px;
    padding:12px 6px; text-align:center;
    font-size:13px; font-weight:500; color:#ddd;
    cursor:pointer; border:none;
    font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;
  }
  .more-grid-item:active { background:#2e2e2e; color:#fff; }


  /* ── 토스트 알림 ── */
  .toast-msg {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: rgba(50,50,50,0.97); color: #fff;
    font-size: 13px; font-weight: 500;
    padding: 11px 20px; border-radius: 20px;
    white-space: nowrap; z-index: 9999;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    font-family: -apple-system, sans-serif;
  }
  .toast-msg.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }
  /* ── 인라인 확인 (confirm 대체) ── */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 9000; display: none; align-items: center; justify-content: center; padding: 0 40px;
  }
  .confirm-overlay.active { display: flex; }
  .confirm-box {
    background: #242424; border-radius: 16px; padding: 24px 20px 16px; width: 100%; max-width: 300px;
  }
  .confirm-msg { font-size: 15px; color: #fff; text-align: center; margin-bottom: 20px; line-height: 1.5; font-family: -apple-system, sans-serif; }
  .confirm-btns { display: flex; gap: 8px; }
  .confirm-cancel { flex: 1; background: #333; border: none; border-radius: 10px; color: #888; font-size: 15px; padding: 12px; cursor: pointer; font-family: -apple-system, sans-serif; }
  .confirm-ok { flex: 1; background: #f87171; border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; padding: 12px; cursor: pointer; font-family: -apple-system, sans-serif; }


  /* ── 사용자 뱃지 ── */
  .user-badge {
    font-size: 11px; font-weight: 500;
    padding: 3px 8px; border-radius: 10px;
    background: rgba(77,163,255,0.15);
    color: #4da3ff; margin-left: 6px;
    display: none;
  }
  .user-badge.show { display: inline-block; }


  /* ── 설정 시트 ── */
  .settings-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2100; display:none; align-items:flex-end; }
  .settings-overlay.active { display:flex; }
  .settings-sheet { background:#1e1e1e; border-radius:20px 20px 0 0; width:100%; padding:20px 20px 40px; }
  .settings-handle { width:40px; height:4px; background:#444; border-radius:2px; margin:0 auto 20px; }
  .settings-title { font-size:16px; font-weight:600; text-align:center; margin-bottom:20px; }
  .settings-list { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .settings-item { display:flex; align-items:center; gap:14px; background:#242424; border-radius:14px; padding:16px; cursor:pointer; border:none; width:100%; text-align:left; font-family:-apple-system,"Apple SD Gothic Neo",sans-serif; }
  .settings-item:active { background:#2e2e2e; }
  .settings-item-icon { font-size:20px; width:28px; text-align:center; }
  .settings-item-text { display:flex; flex-direction:column; gap:3px; }
  .settings-item-title { font-size:15px; font-weight:500; color:#eee; }
  .settings-item-desc { font-size:12px; color:#666; }
  .settings-close { width:100%; background:#333; border:none; border-radius:12px; color:#fff; font-size:15px; padding:14px; cursor:pointer; margin-top:4px; }

  /* ── 이름 설정 모달 ── */
  .name-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2200; display:none; align-items:flex-end; }
  .name-overlay.active { display:flex; }
  .name-sheet { background:#1e1e1e; border-radius:20px 20px 0 0; width:100%; padding:20px; }
  .ns-handle { width:40px; height:4px; background:#444; border-radius:2px; margin:0 auto 20px; }
  .ns-title { font-size:16px; font-weight:600; text-align:center; margin-bottom:20px; }
  .ns-form { display:flex; flex-direction:column; gap:16px; margin-bottom:20px; }
  .ns-label { font-size:13px; color:#888; margin-bottom:6px; }
  .ns-input { width:100%; background:#242424; border:1px solid #333; border-radius:10px; color:#fff; font-size:15px; padding:12px; }
  .ns-input:focus { outline:none; border-color:#007aff; }
  .ns-btn-row { display:flex; gap:10px; }
  .ns-cancel, .ns-save { flex:1; border:none; border-radius:10px; font-size:15px; padding:12px; cursor:pointer; }
  .ns-cancel { background:#333; color:#fff; }

  </div>
  <div id="editContent"></div>
  </div>
</div>

<script>

/* ── 토스트 & 확인 다이얼로그 ── */
function showToast(msg, duration=2000){
  const el = document.getElementById('toastMsg');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), duration);
}
let confirmResolve = null;
function showConfirm(msg){
  return new Promise(resolve => {
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmOverlay').classList.add('active');
    confirmResolve = (result) => {
      document.getElementById('confirmOverlay').classList.remove('active');
      resolve(result);
    };
  });
}


function getPrefix(){ return localStorage.getItem('af_active_prefix')||'u1_'; }
function pk(key){ return getPrefix()+key; }

const LOAN_TYPES    = ['주택담보','전세자금','신용대출','마이너스','기타'];
const REPAY_METHODS = [
  { key:'equal_payment',   label:'원리금균등', desc:'매달 동일한 금액을 납부해요. 초기 이자 부담이 크고 후반엔 원금 상환 비중이 높아져요.' },
  { key:'equal_principal', label:'원금균등',   desc:'매달 원금을 균등하게 상환하고 이자는 줄어들어요. 초기 납부액이 크지만 총 이자가 적어요.' },
  { key:'increasing',      label:'체증식',     desc:'초기 납부액이 낮고 매년 일정 비율로 증가해요. 소득이 늘어날 예정인 경우 적합해요.' },
  { key:'bullet',          label:'만기일시',   desc:'기간 중에는 이자만 내고 만기에 원금을 일시 상환해요. 마이너스통장, 전세자금 등에 많이 쓰여요.' },
];
const RATE_TYPES = [
  { key:'fixed',    label:'고정금리' },
  { key:'variable', label:'변동금리' },
  { key:'mixed',    label:'혼합형'   },
];
const REPAY_YEARS = [1, 5, 10, 20, 30, 40];

const BANK_ICONS = {
  '신한은행':'💙','KB국민':'⭐','우리은행':'💚','하나은행':'🟢',
  'NH농협':'🌾','IBK기업':'🏛','토스뱅크':'🔵','카카오뱅크':'💛',
  'SC제일':'🔷','씨티은행':'🏦','우체국':'📮','기타':'🏦'
};

// 거치기간 불필요 유형
function hasGracePeriod(loanType){ return !['신용대출','마이너스'].includes(loanType); }
// 마이너스통장 여부
function isMinus(loanType){ return loanType === '마이너스'; }
// 만기일시 적용 여부
function isBullet(method){ return method === 'bullet'; }

const DEFAULT_LOANS = [];
function loadLoans(){ try{ const s=localStorage.getItem(pk('af_loans')); return s?JSON.parse(s):DEFAULT_LOANS; } catch{ return DEFAULT_LOANS; } }
function saveLoans(d){ localStorage.setItem(pk('af_loans'),JSON.stringify(d)); }

let loans = loadLoans();
let sortMode = 'expiry'; // expiry | rate | balance

/* ══════════════════════════════════════
   계산 엔진
══════════════════════════════════════ */
function calcEqualPayment(principal, annualRate, totalMonths){
  const r = annualRate / 100 / 12;
  if(r===0) return { monthly:principal/totalMonths, totalInterest:0, totalPayment:principal };
  const monthly = principal * r * Math.pow(1+r, totalMonths) / (Math.pow(1+r, totalMonths) - 1);
  const totalPayment = monthly * totalMonths;
  return { monthly, totalInterest: totalPayment - principal, totalPayment };
}

function calcEqualPrincipal(principal, annualRate, totalMonths){
  const r = annualRate / 100 / 12;
  const monthlyPrincipal = principal / totalMonths;
  const firstMonthly = monthlyPrincipal + principal * r;
  const lastMonthly  = monthlyPrincipal + monthlyPrincipal * r;
  let totalInterest = 0;
  for(let i=0; i<totalMonths; i++) totalInterest += (principal - monthlyPrincipal * i) * r;
  return { firstMonthly, lastMonthly, monthlyPrincipal, totalInterest, totalPayment: principal + totalInterest };
}

function calcIncreasing(principal, annualRate, totalMonths){
  const r = annualRate / 100 / 12;
  const years = Math.ceil(totalMonths / 12);
  const equalPayment = calcEqualPayment(principal, annualRate, totalMonths).monthly;
  const startRatio = 0.65;
  const firstMonthly = equalPayment * startRatio;
  const annualIncrease = (equalPayment - firstMonthly) / (years - 1) || 0;
  let remaining = principal, totalInterest = 0, totalPayment = 0;
  for(let m=0; m<totalMonths; m++){
    const year = Math.floor(m/12);
    const monthlyPayment = firstMonthly + annualIncrease * year;
    const interest = remaining * r;
    const principalPart = monthlyPayment - interest;
    totalInterest += interest; totalPayment += monthlyPayment; remaining -= principalPart;
    if(remaining < 0) remaining = 0;
  }
  const lastMonthly = firstMonthly + annualIncrease * (years-1);
  return { firstMonthly, lastMonthly, annualIncrease, totalInterest, totalPayment };
}

// 만기일시: 매달 이자만 납부
function calcBullet(principal, annualRate, totalMonths){
  const monthlyInterest = principal * (annualRate / 100 / 12);
  return { monthlyInterest, totalInterest: monthlyInterest * totalMonths, totalPayment: principal + monthlyInterest * totalMonths };
}

function elapsedMonths(startDate){
  if(!startDate) return 0;
  const now = new Date(), start = new Date(startDate);
  return Math.max(0, (now.getFullYear()-start.getFullYear())*12 + now.getMonth()-start.getMonth());
}
function totalMonthsBetween(startDate, endDate){
  if(!startDate||!endDate) return 0;
  const s=new Date(startDate), e=new Date(endDate);
  return Math.max(1, (e.getFullYear()-s.getFullYear())*12 + e.getMonth()-s.getMonth());
}
function remainStr(months){
  if(months<=0) return '만기 도래';
  const y=Math.floor(months/12), m=months%12;
  if(y>0&&m>0) return `${y}년 ${m}개월 남음`;
  if(y>0)      return `${y}년 남음`;
  return `${m}개월 남음`;
}
function fmtWon(n){ return Math.round(n).toLocaleString('ko-KR')+'원'; }
function fmtWonShort(n){
  n=Math.round(n);
  if(n>=100000000){ const u=Math.floor(n/100000000),r=n%100000000; return r>0?`${u}억 ${r.toLocaleString('ko-KR')}원`:`${u}억원`; }
  if(n>=10000){ const u=Math.floor(n/10000),r=n%10000; return r>0?`${u}만 ${r.toLocaleString('ko-KR')}원`:`${u}만원`; }
  return n.toLocaleString('ko-KR')+'원';
}

/* 월 납부액 계산 (카드 + 합계용) */
function getMonthlyPayment(l){
  const totM = totalMonthsBetween(l.startDate, l.endDate);
  const elapsed = elapsedMonths(l.startDate);
  const remain = Math.max(1, totM - elapsed);
  if(!l.balance||!l.rate) return 0;
  if(l.repayMethod==='bullet') return calcBullet(l.balance, l.rate, remain).monthlyInterest;
  if(l.repayMethod==='equal_principal') return calcEqualPrincipal(l.balance, l.rate, remain).firstMonthly;
  if(l.repayMethod==='increasing') return calcIncreasing(l.balance, l.rate, remain).firstMonthly;
  return calcEqualPayment(l.balance, l.rate, remain).monthly;
}

/* 만기 임박 (3개월) */
function isExpiryNear(l){
  if(!l.endDate) return false;
  const end = new Date(l.endDate), now = new Date();
  const diffM = (end.getFullYear()-now.getFullYear())*12 + end.getMonth()-now.getMonth();
  return diffM >= 0 && diffM <= 3;
}

/* 정렬 */
function setSort(mode){
  sortMode = mode;
  ['expiry','rate','balance'].forEach((m,i)=>{
    document.getElementById('sortBtn'+i)?.classList.toggle('active', m===mode);
  });
  renderPage();
}
function getSortedLoans(){
  const arr = [...loans];
  if(sortMode==='rate')    return arr.sort((a,b)=>b.rate-a.rate);
  if(sortMode==='balance') return arr.sort((a,b)=>b.balance-a.balance);
  // expiry: 만기 빠른 순 (없으면 뒤로)
  return arr.sort((a,b)=>{
    if(!a.endDate) return 1; if(!b.endDate) return -1;
    return new Date(a.endDate)-new Date(b.endDate);
  });
}

/* ══════════════════════
   렌더링
══════════════════════ */
function renderPage(){
  const total = loans.reduce((s,l)=>s+l.balance,0);
  const totalM = loans.reduce((s,l)=>s+getMonthlyPayment(l),0);
  document.getElementById('totalBalance').textContent = fmtWon(total);
  document.getElementById('totalMonthly').textContent = totalM > 0 ? `월 납부 합계 ${fmtWon(totalM)}` : '';
  document.getElementById('totalSub').textContent = '총 '+loans.length+'건의 대출';

  const el = document.getElementById('loanList');
  if(!loans.length){
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">🏠</div><div class="empty-text">등록된 대출이 없어요<br><span style="font-size:12px;color:#555">자산 편집하기에서 추가해보세요</span></div></div>`;
    return;
  }
  el.innerHTML = getSortedLoans().map(l=>loanCardHTML(l)).join('');
}

function loanCardHTML(l){
  const totM    = totalMonthsBetween(l.startDate, l.endDate);
  const elapsed = elapsedMonths(l.startDate);
  const remain  = Math.max(0, totM - elapsed);
  const pct     = totM > 0 ? Math.min(100,(elapsed/totM)*100) : 0;
  const startDisp = l.startDate||'—';
  const endDisp   = l.endDate  ||'—';
  const totY = Math.floor(totM/12);
  const method = REPAY_METHODS.find(m=>m.key===l.repayMethod)||REPAY_METHODS[0];
  const methodLabel = method.label.replace('\n','');
  const nearExpiry = isExpiryNear(l);

  // 공통 상세 정보 (모든 유형)
  const rateTypeLabel = RATE_TYPES.find(rt=>rt.key===l.rateType)?.label||'고정금리';
  let detailInfo = '';
  if(l.principal){
    const repaidPrincipal = Math.max(0, l.principal - l.balance);
    const repaidPct = l.principal > 0 ? ((repaidPrincipal/l.principal)*100).toFixed(1) : 0;
    detailInfo = `
      <div class="lc-info-grid" style="margin-top:12px;padding-top:12px;border-top:1px solid #2a2a2a">
        <div><div class="lc-info-label">대출 원금</div><div class="lc-info-value">${fmtWonShort(l.principal)}</div></div>
        <div><div class="lc-info-label">상환 원금</div><div class="lc-info-value" style="color:#4ade80">${fmtWonShort(repaidPrincipal)} (${repaidPct}%)</div></div>
        <div><div class="lc-info-label">금리 유형</div><div class="lc-info-value">${rateTypeLabel}${l.rateType==='mixed'?` ${l.fixedYears}년`:''}</div></div>
        <div><div class="lc-info-label">상환 기간</div><div class="lc-info-value">${l.repayYears?l.repayYears+'년':'—'}${l.gracePeriod>0?` (거치 ${l.gracePeriod}개월)`:''}</div></div>
      </div>`;
  }

  // 마이너스통장 한도
  let minusInfo = '';
  if(l.loanType==='마이너스' && l.limitAmount){
    const usedPct = l.limitAmount>0 ? ((l.balance/l.limitAmount)*100).toFixed(1) : 0;
    minusInfo = `
      <div class="lc-info-grid" style="margin-top:12px;padding-top:12px;border-top:1px solid #2a2a2a">
        <div><div class="lc-info-label">한도 금액</div><div class="lc-info-value">${fmtWonShort(l.limitAmount)}</div></div>
        <div><div class="lc-info-label">사용 비율</div><div class="lc-info-value" style="color:#fb923c">${usedPct}%</div></div>
      </div>`;
  }

  // 알림 칩
  let chips = '';
  if(l.prepaymentFreeDate){
    const fpd = new Date(l.prepaymentFreeDate), now = new Date();
    const diffM = (fpd.getFullYear()-now.getFullYear())*12 + fpd.getMonth()-now.getMonth();
    if(diffM>=0 && diffM<=3)
      chips += `<div class="info-chip green">🎉 중도상환 수수료 면제 ${diffM===0?'이번달':'${diffM}개월 후'}</div>`;
    else if(diffM<0)
      chips += `<div class="info-chip green">✅ 중도상환 수수료 면제됨</div>`;
    else
      chips += `<div class="info-chip blue">📅 중도상환 면제일 ${l.prepaymentFreeDate}</div>`;
  }
  if(l.rateType==='variable' && l.nextRateChangeDate){
    const nrd = new Date(l.nextRateChangeDate), now = new Date();
    const diffM2 = (nrd.getFullYear()-now.getFullYear())*12 + nrd.getMonth()-now.getMonth();
    if(diffM2<=3 && diffM2>=0)
      chips += `<div class="info-chip warn">⚠️ 금리 변동 ${diffM2===0?'이번달':'약 '+diffM2+'개월 후'}</div>`;
    else
      chips += `<div class="info-chip orange">📈 다음 금리 변동 ${l.nextRateChangeDate}</div>`;
  }

  const chipsHTML = chips ? `<div class="info-chips">${chips}</div>` : '';

  // 상환 계산
  let calcHTML = '';
  if(totM>0 && l.balance>0 && l.rate>0){
    const rm = remain||totM;
    if(l.repayMethod==='equal_payment'){
      const res = calcEqualPayment(l.balance, l.rate, rm);
      calcHTML = `<div class="calc-box">
        <div class="calc-box-title">💰 월 납부 계산 (원리금균등 · 잔여 ${remainStr(remain)})</div>
        <div class="calc-row"><span class="calc-row-label">매달 납부액</span><span class="calc-row-value highlight">${fmtWon(res.monthly)}</span></div>
        <div class="calc-row"><span class="calc-row-label">남은 총 이자</span><span class="calc-row-value red">${fmtWon(res.totalInterest)}</span></div>
        <div class="calc-row"><span class="calc-row-label">남은 총 상환액</span><span class="calc-row-value">${fmtWon(res.totalPayment)}</span></div>
      </div>`;
    } else if(l.repayMethod==='equal_principal'){
      const res = calcEqualPrincipal(l.balance, l.rate, rm);
      calcHTML = `<div class="calc-box">
        <div class="calc-box-title">💰 월 납부 계산 (원금균등 · 잔여 ${remainStr(remain)})</div>
        <div class="calc-row"><span class="calc-row-label">이번 달 납부액</span><span class="calc-row-value highlight">${fmtWon(res.firstMonthly)}</span></div>
        <div class="calc-row"><span class="calc-row-label">매달 원금 상환</span><span class="calc-row-value">${fmtWon(res.monthlyPrincipal)}</span></div>
        <div class="calc-row"><span class="calc-row-label">마지막 달 납부액</span><span class="calc-row-value green">${fmtWon(res.lastMonthly)}</span></div>
        <div class="calc-row"><span class="calc-row-label">남은 총 이자</span><span class="calc-row-value red">${fmtWon(res.totalInterest)}</span></div>
      </div>`;
    } else if(l.repayMethod==='increasing'){
      const res = calcIncreasing(l.balance, l.rate, rm);
      calcHTML = `<div class="calc-box">
        <div class="calc-box-title">💰 월 납부 계산 (체증식 · 잔여 ${remainStr(remain)})</div>
        <div class="calc-row"><span class="calc-row-label">현재 월 납부액</span><span class="calc-row-value highlight">${fmtWon(res.firstMonthly)}</span></div>
        <div class="calc-row"><span class="calc-row-label">매년 증가액</span><span class="calc-row-value">${fmtWon(res.annualIncrease)}</span></div>
        <div class="calc-row"><span class="calc-row-label">최종 월 납부액</span><span class="calc-row-value red">${fmtWon(res.lastMonthly)}</span></div>
        <div class="calc-row"><span class="calc-row-label">남은 총 이자</span><span class="calc-row-value red">${fmtWon(res.totalInterest)}</span></div>
        <div class="calc-notice">※ 체증식은 실제 은행 조건에 따라 달라질 수 있어요</div>
      </div>`;
    } else if(l.repayMethod==='bullet'){
      const res = calcBullet(l.balance, l.rate, rm);
      calcHTML = `<div class="calc-box">
        <div class="calc-box-title">💰 월 납부 계산 (만기일시 · 잔여 ${remainStr(remain)})</div>
        <div class="calc-row"><span class="calc-row-label">매달 이자</span><span class="calc-row-value highlight">${fmtWon(res.monthlyInterest)}</span></div>
        <div class="calc-row"><span class="calc-row-label">만기 시 원금 상환</span><span class="calc-row-value red">${fmtWon(l.balance)}</span></div>
        <div class="calc-row"><span class="calc-row-label">남은 총 이자</span><span class="calc-row-value red">${fmtWon(res.totalInterest)}</span></div>
        <div class="calc-row"><span class="calc-row-label">총 납부 예정액</span><span class="calc-row-value">${fmtWon(res.totalPayment)}</span></div>
      </div>`;
    }
  }

  return `
  <div class="loan-card">
    ${nearExpiry ? `<div class="expiry-badge">⚠️ 만기 임박</div>` : ''}
    <div class="lc-top">
      <div class="lc-bank-icon" style="background:${bankBg(l.bank)}">${l.bankIcon||'🏦'}</div>
      <div class="lc-bank-info">
        <div class="lc-bank-name">${l.bank} · ${l.loanType||''}</div>
        <div class="lc-loan-name">${l.name}</div>
      </div>
    </div>
    <div class="lc-main">
      <span class="lc-balance">${fmtWon(l.balance)}</span>
      <span class="lc-rate">${l.rate}%</span>
      <span class="lc-method-badge">${methodLabel}</span>
    </div>
    <div class="lc-info-grid">
      <div><div class="lc-info-label">대출 시작일</div><div class="lc-info-value">${startDisp}</div></div>
      <div><div class="lc-info-label">만기일</div><div class="lc-info-value">${endDisp}</div></div>
      <div><div class="lc-info-label">대출 기간</div><div class="lc-info-value">${totY>0?totY+'년':totM+'개월'}</div></div>
      <div><div class="lc-info-label">연 금리</div><div class="lc-info-value">${l.rate}%</div></div>
    </div>
    ${detailInfo}
    ${minusInfo}
    ${chipsHTML}
    <div class="lc-progress-wrap">
      <div class="lc-progress-top">
        <span>${startDisp.slice(0,7)} 시작</span>
        <span>${remainStr(remain)}</span>
        <span>${endDisp.slice(0,7)} 만기</span>
      </div>
      <div class="lc-progress-bar">
        <div class="lc-progress-fill" style="width:${pct.toFixed(1)}%"></div>
      </div>
    </div>
    ${l.interestDay ? `
    <div class="lc-interest-day">
      <div class="lc-interest-dot"></div>
      <span class="day-label">이자 나가는 날</span>
      <span class="day-value">매월 ${l.interestDay}일</span>
    </div>` : ''}
    ${calcHTML}
  </div>`;
}

function bankBg(bank){

/* ── 공용 폼 ── */

      </div>

      <!-- 만기일시 선택 시 기간 숨김 -->

          ${isEdit?'저장하기':'추가하기'}

/* ── 폼 이벤트 핸들러 ── */
function pickBtn(btn, gridId){
  document.querySelectorAll(`#${gridId} .type-btn`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function pickLoanType(btn){
  pickBtn(btn, 'loanTypeGrid');
  const lt = btn.dataset.v;
  const method = document.querySelector('#repayGrid .type-btn.active')?.dataset.v || 'equal_payment';
  // 마이너스통장
  const minusEl = document.getElementById('minusFields');
  if(minusEl) minusEl.style.display = isMinus(lt) ? 'block' : 'none';
  // 거치기간
  const graceEl = document.getElementById('graceRow');
  if(graceEl) graceEl.style.display = (hasGracePeriod(lt) && !isBullet(method)) ? 'block' : 'none';
  updateCalcPreview();
}

function pickRateType(btn){
  pickBtn(btn, 'rateTypeGrid');
  const rt = btn.dataset.v;
  const mixedEl = document.getElementById('mixedYearsRow');
  if(mixedEl) mixedEl.style.display = rt==='mixed' ? 'block' : 'none';
  const nextRateEl = document.getElementById('nextRateRow');
  if(nextRateEl) nextRateEl.style.display = rt==='variable' ? 'block' : 'none';
}

function pickRepay(btn){
  pickBtn(btn, 'repayGrid');
  const key = btn.dataset.v;
  const m = REPAY_METHODS.find(x=>x.key===key);
  const descEl = document.getElementById('methodDesc');
  if(descEl) descEl.textContent = m?.desc||'';

  // 만기일시: 상환기간·거치기간 숨김
  const periodEl = document.getElementById('repayPeriodFields');
  if(periodEl) periodEl.style.display = isBullet(key) ? 'none' : 'block';

  // 거치기간 가시성
  const lt = document.querySelector('#loanTypeGrid .type-btn.active')?.dataset.v || LOAN_TYPES[0];
  const graceEl = document.getElementById('graceRow');
  if(graceEl) graceEl.style.display = (hasGracePeriod(lt) && !isBullet(key)) ? 'block' : 'none';

  updateCalcPreview();
}

function toggleExtraFields(){
  const el = document.getElementById('extraFields');
  const icon = document.getElementById('extraToggleIcon');
  const btn = document.getElementById('extraToggleBtn');
  const isOpen = el.style.display !== 'none';
  el.style.display = isOpen ? 'none' : 'block';
  icon.textContent = isOpen ? '＋' : '－';
  btn.style.color = isOpen ? '#888' : '#007aff';
  btn.style.borderColor = isOpen ? '#333' : '#007aff44';
  btn.style.background = isOpen ? '#2a2a2a' : '#007aff11';
}

function pickRepayYears(btn){
  pickBtn(btn, 'repayYearsGrid');
  autoCalcEndDate();
  updateCalcPreview();
  // 수정 모드이거나 추가 정보가 이미 입력된 경우 자동 펼침
  if(isEdit && (p.principal||p.rateType!=='fixed'||p.gracePeriod||p.interestDay||p.prepaymentFreeDate||p.nextRateChangeDate)){
    toggleExtraFields();
  }
}

/* 만기일 자동계산 */
function autoCalcEndDate(){
  const startVal = document.getElementById('fStart')?.value;
  const yearsBtn = document.querySelector('#repayYearsGrid .type-btn.active');
  if(!startVal || !yearsBtn) return;
  const years = parseInt(yearsBtn.dataset.v)||0;
  if(!years) return;
  const start = new Date(startVal);
  start.setFullYear(start.getFullYear() + years);
  const endStr = start.toISOString().slice(0,10);
  const endEl = document.getElementById('fEnd');
  if(endEl){ endEl.value = endStr; updateCalcPreview(); }
}

/* 실시간 계산 미리보기 */
function updateCalcPreview(){
  const balance  = parseInt(document.getElementById('fBalance')?.value)||0;
  const rate     = parseFloat(document.getElementById('fRate')?.value)||0;
  const startVal = document.getElementById('fStart')?.value||'';
  const endVal   = document.getElementById('fEnd')?.value||'';
  const method   = document.querySelector('#repayGrid .type-btn.active')?.dataset.v||'equal_payment';
  const preview  = document.getElementById('calcPreview');
  if(!preview) return;

  if(!balance||!rate||!startVal||!endVal){
    preview.innerHTML='<div class="cp-title" style="color:#555">금액·금리·기간을 입력하면 자동으로 계산돼요</div>';
    return;
  }

  const totM = totalMonthsBetween(startVal, endVal);
  const elapsed = elapsedMonths(startVal);
  const remain = Math.max(1, totM - elapsed);
  let rows = '';

  if(method==='equal_payment'){
    const res = calcEqualPayment(balance, rate, remain);
    rows = `
      <div class="cp-row"><span class="cp-label">매달 납부액</span><span class="cp-value orange">${fmtWon(res.monthly)}</span></div>
      <div class="cp-row"><span class="cp-label">총 이자 부담</span><span class="cp-value red">${fmtWon(res.totalInterest)}</span></div>
      <div class="cp-row"><span class="cp-label">총 상환액</span><span class="cp-value">${fmtWon(res.totalPayment)}</span></div>
      <div class="cp-row"><span class="cp-label">잔여 기간</span><span class="cp-value">${remainStr(remain)}</span></div>`;
  } else if(method==='equal_principal'){
    const res = calcEqualPrincipal(balance, rate, remain);
    rows = `
      <div class="cp-row"><span class="cp-label">이번 달 납부액</span><span class="cp-value orange">${fmtWon(res.firstMonthly)}</span></div>
      <div class="cp-row"><span class="cp-label">매달 원금</span><span class="cp-value">${fmtWon(res.monthlyPrincipal)}</span></div>
      <div class="cp-row"><span class="cp-label">마지막 달 납부액</span><span class="cp-value">${fmtWon(res.lastMonthly)}</span></div>
      <div class="cp-row"><span class="cp-label">총 이자 부담</span><span class="cp-value red">${fmtWon(res.totalInterest)}</span></div>
      <div class="cp-row"><span class="cp-label">잔여 기간</span><span class="cp-value">${remainStr(remain)}</span></div>`;
  } else if(method==='increasing'){
    const res = calcIncreasing(balance, rate, remain);
    rows = `
      <div class="cp-row"><span class="cp-label">현재 월 납부액</span><span class="cp-value orange">${fmtWon(res.firstMonthly)}</span></div>
      <div class="cp-row"><span class="cp-label">매년 증가액</span><span class="cp-value">${fmtWon(res.annualIncrease)}</span></div>
      <div class="cp-row"><span class="cp-label">최종 월 납부액</span><span class="cp-value red">${fmtWon(res.lastMonthly)}</span></div>
      <div class="cp-row"><span class="cp-label">총 이자 부담</span><span class="cp-value red">${fmtWon(res.totalInterest)}</span></div>
      <div class="cp-row"><span class="cp-label">잔여 기간</span><span class="cp-value">${remainStr(remain)}</span></div>`;
  } else if(method==='bullet'){
    const res = calcBullet(balance, rate, remain);
    rows = `
      <div class="cp-row"><span class="cp-label">매달 이자</span><span class="cp-value orange">${fmtWon(res.monthlyInterest)}</span></div>
      <div class="cp-row"><span class="cp-label">만기 일시 상환</span><span class="cp-value red">${fmtWon(balance)}</span></div>
      <div class="cp-row"><span class="cp-label">총 이자 부담</span><span class="cp-value red">${fmtWon(res.totalInterest)}</span></div>
      <div class="cp-row"><span class="cp-label">잔여 기간</span><span class="cp-value">${remainStr(remain)}</span></div>`;
  }

  preview.innerHTML = `<div class="cp-title">📊 예상 납부 계획</div>${rows}`;
}

/* ── CRUD ── */
function readForm(){
  const name    = document.getElementById('fName').value.trim();
  const bank    = document.getElementById('fBank').value.trim();
  const balance = parseInt(document.getElementById('fBalance').value)||0;
  const rate    = parseFloat(document.getElementById('fRate').value)||0;
  const start   = document.getElementById('fStart').value;
  const end     = document.getElementById('fEnd').value;
  const intDay  = parseInt(document.getElementById('fIntDay').value)||0;
  const principal = parseInt(document.getElementById('fPrincipal')?.value)||0;
  const loanType  = document.querySelector('#loanTypeGrid .type-btn.active')?.dataset.v||LOAN_TYPES[0];
  const repayMethod = document.querySelector('#repayGrid .type-btn.active')?.dataset.v||'equal_payment';
  const rateType  = document.querySelector('#rateTypeGrid .type-btn.active')?.dataset.v||'fixed';
  const fixedYears = parseInt(document.getElementById('fFixedYears')?.value)||0;
  const repayYears = parseInt(document.querySelector('#repayYearsGrid .type-btn.active')?.dataset.v)||0;
  const gracePeriod = parseInt(document.getElementById('fGracePeriod')?.value)||0;
  const limitAmount = parseInt(document.getElementById('fLimit')?.value)||0;
  const nextRateChangeDate = document.getElementById('fNextRateDate')?.value||'';
  const prepaymentFreeDate = document.getElementById('fPrepayFree')?.value||'';
  const bankIcon  = BANK_ICONS[bank]||'🏦';

  if(!name)   { showToast('대출명을 입력해주세요.');  return null; }
  if(!bank)   { showToast('은행을 입력해주세요.');    return null; }
  if(!balance){ showToast('대출 잔액을 입력해주세요.'); return null; }
  if(!rate)   { showToast('금리를 입력해주세요.');    return null; }

  return {
    name, bank, bankIcon, balance, rate,
    startDate: start, endDate: end, interestDay: intDay,
    loanType, repayMethod, rateType, fixedYears,
    repayYears: isBullet(repayMethod) ? 0 : repayYears,
    gracePeriod: (hasGracePeriod(loanType) && !isBullet(repayMethod)) ? gracePeriod : 0,
    principal,
    limitAmount: isMinus(loanType) ? limitAmount : 0,
    nextRateChangeDate: rateType==='variable' ? nextRateChangeDate : '',
    prepaymentFreeDate,
  };
}

function addLoan(){
  const loan=readForm(); if(!loan) return;
  loan.id=Date.now(); loans.push(loan);
  saveLoans(loans); showEditMain(); renderPage(); showToast('저장됐어요');
}
function updateLoan(id){
  const loan=readForm(); if(!loan) return;
  const idx=loans.findIndex(x=>x.id===id);
  if(idx!==-1) loans[idx]={...loans[idx],...loan};
  saveLoans(loans); showEditMain(); renderPage(); showToast('저장됐어요');
}
async function deleteLoan(id){
  loans=loans.filter(x=>Number(x.id)!==Number(id));
  saveLoans(loans); showEditMain(); renderPage(); showToast('저장됐어요');
}

/* ── 스와이프로 모달 닫기 ── */
(function(){
  let startY=0, currentY=0, isDragging=false;
  const overlay = document.getElementById('fsOverlay');
  const sheet   = overlay?.querySelector('.fs-body-legacy');
  const handle  = overlay?.querySelector('.modal-handle');
  if(!handle||!sheet||!overlay) return;
  function onStart(e){ const t=e.touches?e.touches[0]:e; startY=t.clientY; currentY=startY; isDragging=true; sheet.style.transition='none'; }
  function onMove(e){ if(!isDragging)return; const t=e.touches?e.touches[0]:e; currentY=t.clientY; const d=currentY-startY; if(d>0)sheet.style.transform=`translateY(${d}px)`; }
  function onEnd(){ if(!isDragging)return; isDragging=false; sheet.style.transition='transform 0.2s ease'; const d=currentY-startY; if(d>100)closeEditModal(); else sheet.style.transform='translateY(0)'; }
  handle.addEventListener('touchstart',onStart,{passive:true});
  handle.addEventListener('touchmove', onMove, {passive:true});
  handle.addEventListener('touchend',  onEnd,  {passive:true});
  handle.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove',e=>{ if(isDragging)onMove(e); });
  document.addEventListener('mouseup',  onEnd);
})();

renderPage();

/* ── 사용자 뱃지 ── */

<script>
(function(){
  const prefix = localStorage.getItem('af_active_prefix')||'u1_';
  const u1name = localStorage.getItem('af_name_u1')||'사용자1';
  const u2name = localStorage.getItem('af_name_u2')||'사용자2';
  const badge = document.getElementById('userBadge');
  if(!badge) return;
  if(prefix==='u1_'){ badge.textContent=u1name; badge.classList.add('show'); }
  else if(prefix==='u2_'){ badge.textContent=u2name; badge.classList.add('show'); }
})();

/* ── 설정 시트 ── */
function openSettingsSheet() { document.getElementById("settingsOverlay").classList.add("active"); }
function closeSettingsSheet() { document.getElementById("settingsOverlay").classList.remove("active"); }

/* ── 이름 설정 ── */
function openNameModal() {
  document.getElementById('nsInput1').value = localStorage.getItem('af_name_u1') || '';
  document.getElementById('nsInput2').value = localStorage.getItem('af_name_u2') || '';
  document.getElementById('nameOverlay').classList.add('active');
}
function closeNameModal() { document.getElementById('nameOverlay').classList.remove('active'); }
function saveNames() {
  const n1 = document.getElementById('nsInput1').value.trim() || '사용자1';
  const n2 = document.getElementById('nsInput2').value.trim() || '사용자2';
  localStorage.setItem('af_name_u1', n1);
  localStorage.setItem('af_name_u2', n2);
  closeNameModal();
}
/* ── 데이터 초기화 ── */
const _RESET_KEYS = [
  'af_accounts','af_accounts_history','af_accounts_cashflow',
  'af_invest','af_invest_visibility','af_loans',
  'af_cards_meta','af_cards_spend','af_ins_meta','af_expense',
  'af_inc_meta','af_inc_spend','af_cars','af_dividends',
  'af_realestate','af_re_history',
];
function openResetModal() {
  const prefix = localStorage.getItem('af_active_prefix') || 'u1_';
  const u1 = localStorage.getItem('af_name_u1') || '사용자1';
  const u2 = localStorage.getItem('af_name_u2') || '사용자2';
  const name = prefix === 'u1_' ? u1 : u2;
  document.getElementById('rsTargetName').textContent = name;
  document.getElementById('rsStep1').style.display = 'block';
  document.getElementById('rsStep2').style.display = 'none';
  document.getElementById('resetOverlay').classList.add('active');
}
function closeResetModal() {
  document.getElementById('resetOverlay').classList.remove('active');
  document.getElementById('rsConfirmInput').value = '';
}
function goStep2() {
  document.getElementById('rsStep1').style.display = 'none';
  document.getElementById('rsStep2').style.display = 'block';
}
function backStep1() {
  document.getElementById('rsStep1').style.display = 'block';
  document.getElementById('rsStep2').style.display = 'none';
  document.getElementById('rsConfirmInput').value = '';
}
function checkResetInput() {
  const val = document.getElementById('rsConfirmInput').value.trim();
  const btn = document.getElementById('rsFinalBtn');
  btn.disabled = val !== '삭제';
  btn.style.opacity = val !== '삭제' ? '0.4' : '1';
}
function executeReset() {
  const prefix = localStorage.getItem('af_active_prefix') || 'u1_';
  _RESET_KEYS.forEach(k => localStorage.removeItem(prefix + k));
  closeResetModal();
  closeSettingsSheet();
  if(typeof showToast === 'function') showToast('초기화 완료');
}
</script>

<!-- 설정 시트 -->
<div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettingsSheet()">

          <div class="settings-item-title">데이터 초기화</div>

      </div>
      <div>

        <input class="ns-input" id="nsInput2" type="text" placeholder="예) 사용자2" maxlength="6">

<!-- 초기화 모달 -->
<div class="reset-overlay" id="resetOverlay" onclick="if(event.target===this)closeResetModal()">
  <div class="reset-sheet">
    <div class="rs-icon">🗑️</div>
    <div id="rsStep1">
      <div class="rs-title">데이터 초기화</div>
      <div class="rs-desc">
        <strong id="rsTargetName">—</strong>의 모든 데이터가<br>
        <strong>완전히 삭제</strong>돼요.<br>삭제 후 복구가 불가능해요.
      </div>
      <div class="rs-btns">
        <button class="rs-cancel" onclick="closeResetModal()">취소</button>
        <button class="rs-confirm" onclick="goStep2()">계속 진행하기</button>
      </div>
    </div>
    <div id="rsStep2" class="rs-step2">
      <div class="rs-title">정말 삭제할까요?</div>
      <div class="rs-desc">확인을 위해 아래에 <strong>"삭제"</strong>를 입력해주세요</div>
      <div class="rs-input-wrap">
        <input class="rs-input" id="rsConfirmInput" type="text" placeholder="삭제" oninput="checkResetInput()">
      </div>
      <div class="rs-btns">
        <button class="rs-cancel" onclick="backStep1()">뒤로</button>
        <button class="rs-confirm" id="rsFinalBtn" onclick="executeReset()" disabled style="opacity:0.4">초기화 실행</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  function patchBackBtn(){
    document.querySelectorAll(".back-btn").forEach(function(btn){
      var oc = btn.getAttribute("onclick") || "";
      if(oc.indexOf("showView") !== -1) return;
      btn.setAttribute("onclick", "location.href='asset_manager_mobile.html'");
    });
  }
  function isModalOpen(){
    var sel = [
      ".sheet-overlay.active",".fs-overlay-legacy.active",".category-overlay.active",
      ".amount-overlay.active",".settings-overlay.active",".name-overlay.active",".reset-overlay.active"
    ];
    return sel.some(function(s){ try{ return !!document.querySelector(s); }catch(e){ return false; } });
  }
  function patchSwipe(){
    var sx=0,sy=0;
    document.addEventListener("touchstart",function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
    document.addEventListener("touchend",function(e){
      var dx=e.changedTouches[0].clientX-sx, dy=Math.abs(e.changedTouches[0].clientY-sy);
      if(dx>50 && dy<30 && !isModalOpen()) history.back();
    },{passive:true});
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",function(){ patchBackBtn(); patchSwipe(); });
  else { patchBackBtn(); patchSwipe(); }
})();
</script>
