<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>월별 추이 - AssetFlow</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#1a1a1a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; min-height:100vh; padding-bottom:180px; }
  .header { display:flex; align-items:center; padding:16px 20px; position:sticky; top:0; background:#1a1a1a; z-index:100; }
  .back-btn { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:4px 8px 4px 0; line-height:1; }
  .header-title { font-size:17px; font-weight:600; margin-left:4px; }
  .main-card { margin:4px 20px 16px; background:#242424; border-radius:18px; padding:20px; }
  .mc-label { font-size:13px; color:#888; margin-bottom:6px; }
  .mc-net   { font-size:28px; font-weight:700; letter-spacing:-0.5px; }
  .mc-net.pos { color:#4ade80; }
  .mc-net.neg { color:#f87171; }
  .view-tabs { display:flex; justify-content:center; margin-top:16px; }
  .view-tabs-inner { display:flex; background:#1a1a1a; border-radius:20px; padding:3px; gap:2px; }
  .view-tab { background:none; border:none; color:#888; font-size:14px; font-weight:500; padding:7px 20px; border-radius:17px; cursor:pointer; transition:all 0.2s; }
  .view-tab.active { background:#fff; color:#000; font-weight:700; }
  .chart-legend { display:flex; justify-content:flex-end; gap:14px; padding:0 16px 10px; }
  .cl-item { display:flex; align-items:center; gap:5px; font-size:11px; color:#888; }
  .cl-dot  { width:8px; height:8px; border-radius:50%; }
  .cl-line { width:16px; height:2px; border-radius:1px; }
  .comp-bar { margin:16px 16px 14px; }
  .comp-bar-track { height:14px; border-radius:7px; overflow:hidden; display:flex; gap:2px; }
  .comp-seg { height:100%; border-radius:4px; }
  .comp-list { padding:0 16px; }
  .comp-item { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid #2a2a2a; }
  .comp-item:last-child { border-bottom:none; }
  .comp-left { display:flex; align-items:center; gap:8px; }
  .comp-dot  { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .comp-name { font-size:14px; color:#ccc; }
  .comp-pct  { font-size:13px; color:#666; margin-left:4px; }
  .comp-amt  { font-size:14px; font-weight:600; color:#fff; }
  .summary-section { padding:20px 20px 0; }
  .summary-title   { font-size:14px; font-weight:600; color:#888; margin-bottom:12px; }
  .summary-grid    { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .summary-item    { background:#242424; border-radius:12px; padding:14px 12px; }
  .si-label { font-size:11px; color:#666; margin-bottom:6px; }
  .si-value { font-size:15px; font-weight:700; }
  .si-value.green  { color:#4ade80; }
  .si-value.red    { color:#f87171; }
  .si-value.blue   { color:#4da3ff; }
  .si-value.orange { color:#fb923c; }
  .month-list { padding:20px 20px 0; }
  .ml-title   { font-size:14px; font-weight:600; color:#888; margin-bottom:12px; }
  .ml-item { background:#242424; border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .ml-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .ml-month  { font-size:14px; font-weight:600; color:#eee; }
  .ml-net    { font-size:14px; font-weight:700; }
  .ml-net.pos { color:#4ade80; }
  .ml-net.neg { color:#f87171; }
  .ml-row    { display:flex; justify-content:space-between; align-items:center; padding:3px 0; }
  .ml-row-label { font-size:12px; color:#666; display:flex; align-items:center; gap:5px; }
  .ml-row-dot   { width:7px; height:7px; border-radius:50%; }
  .ml-row-value { font-size:12px; font-weight:500; color:#aaa; }
  .ml-nodata    { font-size:12px; color:#444; text-align:center; padding:6px 0; }
  .edit-hint { margin:16px 20px; background:#242424; border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:10px; }
  .eh-icon { font-size:20px; }
  .eh-text { font-size:13px; color:#888; line-height:1.5; }
  .eh-text strong { color:#fff; }

  /* ── 바텀탭 ── */
  .bottom-tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(20,20,20,0.97);
    border-top: 1px solid #2a2a2a;
    display: flex; padding: 10px 0 28px;
    z-index: 500;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    cursor: pointer; padding: 4px 0;
    background: none; border: none; color: inherit;
  }
  .tab-item-label { font-size: 10px; color: #555; font-weight: 500; letter-spacing: -0.2px; }
  .tab-item.active .tab-item-label { color: #fff; }
  .tab-item-dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; margin-bottom: 1px; }
  .tab-item.active .tab-item-dot { background: #fff; }

  .more-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; display:none; align-items:flex-end; }
  .more-overlay.active { display:flex; }
  .more-sheet { background:#1a1a1a; border-radius:20px 20px 0 0; width:100%; padding:20px 20px 36px; }
  .more-handle { width:40px; height:4px; background:#333; border-radius:2px; margin:0 auto 18px; }
  .more-sec-title { font-size:11px; color:#555; font-weight:600; letter-spacing:0.05em; padding:0 2px 10px; }
  .more-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
  .more-grid-item {
    background:#242424; border-radius:10px;
    padding:12px 6px; text-align:center;
    font-size:13px; font-weight:500; color:#ddd;
    cursor:pointer; border:none;
    font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;
  }
  .more-grid-item:active { background:#2e2e2e; color:#fff; }

  /* 월별상세 접기/펼치기 */
  .ml-toggle-btn {
    width: 100%; background: #1a1a1a; border: none;
    border-radius: 12px; color: #888; font-size: 13px;
    padding: 14px; cursor: pointer; margin-top: 8px;
    font-family: -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .ml-toggle-btn:active { background: #2a2a2a; }
  .ml-toggle-arrow { font-size: 11px; transition: transform 0.2s; }
  .ml-toggle-arrow.open { transform: rotate(180deg); }

</style>
</head>
<body>
<div class="header">
  <button class="back-btn" onclick="location.href='asset_manager_mobile.html'">‹</button>
  <span class="header-title">월별 추이</span>
</div>

<div class="main-card">
  <div class="mc-label">순자산 (자산 - 부채)</div>
  <div class="mc-net" id="netAmount">—</div>
  <div class="view-tabs">
    <div class="view-tabs-inner">
      <button class="view-tab active" id="tabTrend" onclick="switchView('trend')">추이</button>
      <button class="view-tab"        id="tabComp"  onclick="switchView('comp')">구성</button>
    </div>
  </div>
  <div id="trendView">
    <div class="chart-legend">
      <div class="cl-item"><div class="cl-dot" style="background:#4ade80"></div>자산</div>
      <div class="cl-item"><div class="cl-dot" style="background:#555"></div>부채</div>
      <div class="cl-item"><div class="cl-line" style="background:#4da3ff"></div>순자산</div>
    </div>
    <div style="position:relative;height:180px;padding:0 4px">
      <canvas id="trendChart"></canvas>
    </div>
    <div style="display:flex;justify-content:space-between;padding:6px 16px 0;font-size:11px;color:#555" id="xLabels"></div>
  </div>
  <div id="compView" style="display:none;padding-top:14px">
    <div class="comp-bar"><div class="comp-bar-track" id="compBar"></div></div>
    <div class="comp-list" id="compList"></div>
  </div>
</div>

<div class="summary-section">
  <div class="summary-title">이번 달 요약</div>
  <div class="summary-grid" id="summaryGrid"></div>
</div>

<div class="edit-hint">
  <div class="eh-icon">💡</div>
  <div class="eh-text"><strong>자동 집계</strong> — 계좌·투자·대출·보험·수입·지출 페이지에 입력한 데이터를 기반으로 계산돼요</div>
</div>

<div class="month-list">
  <div class="ml-title">월별 상세</div>
  <div id="monthDetailList"></div>
  <button class="ml-toggle-btn" id="mlToggleBtn" onclick="toggleMonthList()">
    <span id="mlToggleText">이전 내역 더 보기</span>
    <span class="ml-toggle-arrow" id="mlToggleArrow">▼</span>
  </button>
</div>

<script>
/* ── prefix ── */
function getPrefix(){ return localStorage.getItem('af_active_prefix')||'u1_'; }
function pk(key){ return getPrefix()+key; }

function rd(key, fb=[]){
  try{ return JSON.parse(localStorage.getItem(pk(key))||'null')||fb; } catch{ return fb; }
}
function rdObj(key){
  try{ return JSON.parse(localStorage.getItem(pk(key))||'null')||{}; } catch{ return {}; }
}

function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
const NOW=new Date(), CY=NOW.getFullYear(), CM=NOW.getMonth()+1;

/* ══════════════════════════════════════
   월별 데이터 빌드 — 모두 pk() 경유
══════════════════════════════════════ */
function buildMonthData(){
  const FREQ={monthly:12,bi2:6,q:4,semi:2,once:1};
  const accList  = rd('af_accounts');
  const accHist  = rdObj('af_accounts_history');
  const invList  = rd('af_invest');
  const loanList = rd('af_loans');
  const incMeta  = rd('af_inc_meta');
  const incSpend = rdObj('af_inc_spend');
  const expItems = rd('af_expense');
  const insList  = rd('af_ins_meta');

  const insMo = insList.filter(x=>!x.isPaid).reduce((s,x)=>s+(x.premium||0),0);
  const expFixed = expItems.reduce((s,x)=>{
    const t=FREQ[x.freq]||12;
    return s+(x.type==='monthly'?x.amount:Math.round((x.amount||0)*t/12));
  },0)+insMo;

  const loanTotal = loanList.reduce((s,l)=>s+(l.balance||0),0);
  const invTotal  = invList.reduce((s,a)=>s+(a.balance||0),0);

  // 부동산
  const reListD  = rd('af_realestate');
  const reHistD  = rdObj('af_re_history');

  const months=[];
  for(let i=11;i>=0;i--){
    let m=CM-i, y=CY;
    if(m<=0){m+=12;y--;}
    const mk=monthKey(y,m);

    // 계좌 — 월별 히스토리
    const mh=accHist[mk]||{};
    const accTotal=accList.reduce((s,a)=>s+(mh[a.id]||0),0);

    // 수입 — 월별 히스토리
    const ms=incSpend[mk]||{};
    const income=incMeta.reduce((s,it)=>s+(ms[it.id]!=null?ms[it.id]:(it.amount||0)),0);

    const reMHD    = reHistD[mk]||{};
    const reTotalD = reListD.reduce((s,re)=>s+(reMHD[re.id]||0),0);
    const reRentDD = reListD.filter(re=>re.rentType==='jeon'||re.rentType==='semi')
                            .reduce((s,re)=>s+(re.rentDeposit||0),0);
    const asset=accTotal+invTotal+reTotalD;
    const net  =asset-loanTotal-reRentDD;
    const hasRealData=accTotal>0||income>0;

    months.push({y,m,mk,asset,debt:loanTotal,net,income,expense:expFixed,saving:income-expFixed,hasRealData});
  }
  return months;
}

/* ── 현재 자산 구성 (구성 탭용) ── */
function getCurrentComp(){
  const accList = rd('af_accounts');
  const accHist = rdObj('af_accounts_history');
  const mk = monthKey(CY,CM);
  const mh = accHist[mk]||{};
  const acc  = accList.reduce((s,a)=>s+(mh[a.id]||0),0);
  const inv  = rd('af_invest').reduce((s,a)=>s+(a.balance||0),0);
  const loan = rd('af_loans').reduce((s,l)=>s+(l.balance||0),0);
  const reList = rd('af_realestate');
  const reHist = rdObj('af_re_history');
  const reMH   = reHist[mk]||{};
  const re = reList.reduce((s,r)=>s+(reMH[r.id]||0),0);
  return {acc,inv,loan,re};
}

/* 포맷 */
function fmt(n){ return Math.round(Math.abs(n)).toLocaleString('ko-KR')+'원'; }
function fmtShort(n){
  const abs=Math.abs(Math.round(n)), sign=n<0?'-':'';
  if(abs>=100000000){ const u=Math.floor(abs/100000000),man=Math.floor((abs%100000000)/10000); return man>0?`${sign}${u}억 ${man}만`:`${sign}${u}억`; }
  if(abs>=10000) return `${sign}${Math.floor(abs/10000)}만`;
  return sign+abs.toLocaleString('ko-KR');
}

/* ══════════════════════
   렌더링
══════════════════════ */
let activeView='trend', chartInst=null;
let monthData=[], latest={};

function renderAll(){
  monthData = buildMonthData();
  latest    = monthData[monthData.length-1];

  const netEl=document.getElementById('netAmount');
  netEl.textContent=(latest.net<0?'-':'')+fmt(latest.net);
  netEl.className='mc-net '+(latest.net>=0?'pos':'neg');

  if(activeView==='trend') renderTrend();
  else renderComp();
  renderSummary();
  renderMonthList();
}

/* 추이 차트 */
function renderTrend(){
  document.getElementById('trendView').style.display='block';
  document.getElementById('compView').style.display='none';

  const labels=monthData.map(d=>d.m+'월');
  document.getElementById('xLabels').innerHTML=
    [0,3,6,9,11].map(i=>`<span>${monthData[i]?.m||''}월</span>`).join('');

  if(chartInst) chartInst.destroy();
  const ctx=document.getElementById('trendChart').getContext('2d');
  chartInst=new Chart(ctx,{
    data:{
      labels,
      datasets:[
        { type:'bar', label:'자산', data:monthData.map(d=>d.asset),
          backgroundColor:monthData.map(d=>d.hasRealData?'rgba(74,222,128,0.7)':'rgba(74,222,128,0.15)'),
          borderRadius:3, order:2 },
        { type:'bar', label:'부채', data:monthData.map(d=>d.debt),
          backgroundColor:'rgba(80,80,90,0.7)', borderRadius:3, order:3 },
        { type:'line', label:'순자산', data:monthData.map(d=>d.net),
          borderColor:'#4da3ff', borderWidth:2.5,
          pointBackgroundColor:'#1a1a1a', pointBorderColor:'#4da3ff', pointBorderWidth:2,
          pointRadius:4, tension:0.3, fill:false, order:1 },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'rgba(20,20,30,0.95)',
          titleColor:'#aaa', bodyColor:'#fff', padding:12, cornerRadius:10,
          callbacks:{
            title:items=>`${items[0].label}`,
            label:item=>{
              const v=item.raw, sign=v<0?'-':'';
              return ` ${item.dataset.label}  ${sign}${Math.abs(Math.round(v)).toLocaleString('ko-KR')}원`;
            }
          }
        }
      },
      scales:{
        x:{display:false},
        y:{display:false}
      }
    }
  });
}

/* 구성 탭 */
function renderComp(){
  document.getElementById('trendView').style.display='none';
  document.getElementById('compView').style.display='block';

  const {acc,inv,loan}=getCurrentComp();
  const segs=[
    {label:'계좌·현금', value:acc,  color:'#4ade80'},
    {label:'투자',      value:inv,  color:'#4da3ff'},
    {label:'부동산',    value:re,   color:'#f59e0b'},
    {label:'대출(부채)',value:loan, color:'#6366f1'},
  ].filter(s=>s.value>0);
  const sumAbs=segs.reduce((s,x)=>s+x.value,0)||1;

  document.getElementById('compBar').innerHTML=segs.map(s=>
    `<div class="comp-seg" style="flex:${s.value};background:${s.color}"></div>`
  ).join('');

  document.getElementById('compList').innerHTML=segs.map(s=>`
    <div class="comp-item">
      <div class="comp-left">
        <div class="comp-dot" style="background:${s.color}"></div>
        <span class="comp-name">${s.label}</span>
        <span class="comp-pct">${(s.value/sumAbs*100).toFixed(0)}%</span>
      </div>
      <div class="comp-amt">${Math.round(s.value).toLocaleString('ko-KR')}원</div>
    </div>`).join('');
}

/* 요약 */
function renderSummary(){
  const inc=latest.income||0, exp=latest.expense||0, sav=latest.saving||0;
  const savRate=inc>0?Math.round(sav/inc*100):0;
  const expRate=inc>0?Math.round(exp/inc*100):0;
  document.getElementById('summaryGrid').innerHTML=`
    <div class="summary-item"><div class="si-label">이번달 수입</div><div class="si-value green">${fmtShort(inc)}</div></div>
    <div class="summary-item"><div class="si-label">고정지출</div><div class="si-value red">${fmtShort(exp)}</div></div>
    <div class="summary-item"><div class="si-label">예상 저축</div><div class="si-value blue">${fmtShort(sav)}</div></div>
    <div class="summary-item"><div class="si-label">저축률</div><div class="si-value ${savRate>=30?'green':'orange'}">${savRate}%</div></div>
    <div class="summary-item"><div class="si-label">지출률</div><div class="si-value ${expRate<=50?'blue':'red'}">${expRate}%</div></div>
    <div class="summary-item"><div class="si-label">순자산</div><div class="si-value ${(latest.net||0)>=0?'green':'red'}">${fmtShort(latest.net||0)}</div></div>`;
}

/* 월별 목록 */
let mlExpanded = false;

function renderMonthList(){
  const memos = loadMemos ? loadMemos() : {};
  const allMonths = [...monthData].reverse(); // 최신순
  const displayMonths = mlExpanded ? allMonths : allMonths.slice(0, 3);

  document.getElementById('monthDetailList').innerHTML = displayMonths.map(d => {
    const isCur = d.y===CY && d.m===CM;
    const prev = monthData[monthData.indexOf(monthData.find(x=>x.y===d.y&&x.m===d.m))-1];
    const diff = prev && d.hasRealData && prev.hasRealData ? d.net - prev.net : null;
    const memo = memos[d.mk || `${d.y}-${String(d.m).padStart(2,'0')}`] || '';

    return `
      <div class="ml-item">
        <div class="ml-header">
          <span class="ml-month">${d.y}년 ${d.m}월${isCur?' <span style="font-size:11px;color:#007aff;background:#007aff22;padding:2px 6px;border-radius:6px">이번달</span>':''}</span>
          <span class="ml-net ${d.net>=0?'pos':'neg'}">${d.net<0?'-':''}${fmt(d.net)}</span>
        </div>
        ${d.hasRealData ? `
        <div class="ml-row">
          <div class="ml-row-label"><div class="ml-row-dot" style="background:#4ade80"></div>자산</div>
          <div class="ml-row-value">${d.asset.toLocaleString('ko-KR')}원</div>
        </div>
        <div class="ml-row">
          <div class="ml-row-label"><div class="ml-row-dot" style="background:#6366f1"></div>부채</div>
          <div class="ml-row-value">-${d.debt.toLocaleString('ko-KR')}원</div>
        </div>
        ${diff !== null ? `
        <div class="ml-row" style="margin-top:4px;padding-top:6px;border-top:0.5px solid #2a2a2a">
          <div class="ml-row-label" style="color:#555">전월 대비</div>
          <div class="ml-row-value" style="color:${diff>=0?'#4ade80':'#f87171'}">${diff>=0?'+':''}${fmtShort(diff)}</div>
        </div>` : ''}
        ${memo ? `<div style="font-size:12px;color:#888;margin-top:8px;padding-top:8px;border-top:0.5px solid #2a2a2a;line-height:1.6">📝 ${memo}</div>` : ''}
        ` : `<div class="ml-nodata">계좌 잔액을 입력하면 표시돼요</div>`}
      </div>`;
  }).join('');

  // 토글 버튼 상태
  const btn = document.getElementById('mlToggleBtn');
  const arrow = document.getElementById('mlToggleArrow');
  const text = document.getElementById('mlToggleText');
  if (allMonths.length <= 3) {
    btn.style.display = 'none';
  } else {
    btn.style.display = 'flex';
    text.textContent = mlExpanded ? '접기' : `이전 ${allMonths.length - 3}개월 더 보기`;
    arrow.className = 'ml-toggle-arrow' + (mlExpanded ? ' open' : '');
  }
}

function toggleMonthList(){
  mlExpanded = !mlExpanded;
  renderMonthList();
  if (!mlExpanded) {
    document.querySelector('.month-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function loadMemos(){
  try { return JSON.parse(localStorage.getItem('af_monthly_memos')||'{}'); } catch { return {}; }
}

function switchView(v){
  activeView=v;
  document.getElementById('tabTrend').classList.toggle('active',v==='trend');
  document.getElementById('tabComp').classList.toggle('active',v==='comp');
  renderAll();
}

renderAll();
</script>

<!-- 바텀탭 -->
<div class="bottom-tab-bar">
  <button class="tab-item" onclick="location.href='asset_manager_mobile.html'">
