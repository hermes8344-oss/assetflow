<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수입 - AssetFlow</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#1a1a1a; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    min-height:100vh; padding-bottom:100px;
  }
  .header { display:flex; align-items:center; padding:16px 20px; position:sticky; top:0; background:#1a1a1a; z-index:100; }
  .back-btn { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:4px 8px 4px 0; line-height:1; }
  .header-title { font-size:17px; font-weight:600; margin-left:4px; }

  /* 월 선택 */
  .month-label-btn { background:none; border:none; padding:4px 20px 14px; display:flex; align-items:center; gap:6px; cursor:pointer; width:100%; }
  .month-label-btn .label-text { font-size:15px; font-weight:600; color:#fff; }
  .month-label-btn .label-arrow { font-size:10px; color:#555; }

  /* 총 수입 */
  .total-card { margin:0 20px 20px; background:#242424; border-radius:16px; padding:20px; }
  .tac-label  { font-size:13px; color:#888; margin-bottom:6px; }
  .tac-amount { font-size:26px; font-weight:700; color:#4ade80; letter-spacing:-0.5px; white-space:nowrap; }

  /* 섹션 헤더 */
  .section-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 10px; }
  .section-title { font-size:13px; color:#888; font-weight:500; }
  .section-total { font-size:13px; color:#888; }

  /* 대분류 헤더 */
  .group-header { padding:20px 20px 10px; border-top:1px solid #2a2a2a; margin-top:8px; }
  .group-header:first-of-type { border-top:none; margin-top:0; }
  .gh-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .gh-title { font-size:15px; font-weight:600; color:#fff; }
  .gh-stats { font-size:12px; color:#666; }

  /* 수입 아이템 (account_page 스타일 적용) */
  .income-list { }
  .income-item { 
    display:flex; align-items:center; padding:14px 0; 
    border-bottom:1px solid #2a2a2a; cursor:pointer; 
    transition:opacity 0.15s; 
  }
  .income-item:last-child { border-bottom:none; }
  .income-item:active { opacity:0.6; }
  
  .inc-dot { width:3px; height:36px; border-radius:2px; flex-shrink:0; margin-right:12px; }
  
  .inc-info { flex:1; min-width:0; }
  .inc-name { font-size:15px; font-weight:500; color:#eee; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px; }
  .inc-sub  { font-size:12px; color:#666; }
  .inc-amount-wrap { text-align:right; flex-shrink:0; margin-left:8px; }
  .inc-amount { font-size:15px; font-weight:600; color:#fff; white-space:nowrap; }
  .empty-section { text-align:center; padding:40px 0; color:#444; font-size:14px; }

  /* 하단 */
  .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(26,26,26,0.97); backdrop-filter:blur(10px); padding:12px 20px 28px; }
  .nav-btn { width:100%; background:#2e2e2e; border:none; border-radius:12px; color:#fff; font-size:14px; font-weight:500; padding:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .nav-btn:active { background:#383838; }

  /* 월 선택 시트 */
  .sheet-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:300; align-items:flex-end; }
  .sheet-overlay.active { display:flex; }
  .sheet-inner { background:#242424; border-radius:24px 24px 0 0; width:100%; padding:20px 20px 40px; animation:slideUp 0.25s ease; transition:transform 0.2s ease; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .sheet-handle { width:36px; height:4px; background:#444; border-radius:2px; margin:0 auto 20px; cursor:grab; }
  .sheet-handle:active { cursor:grabbing; }
  .sheet-title  { font-size:16px; font-weight:700; margin-bottom:20px; }
  .year-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .year-nav { background:#333; border:none; color:#fff; font-size:18px; width:36px; height:36px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .year-nav:disabled { color:#444; cursor:default; }
  .year-lbl { font-size:16px; font-weight:600; }
  .month-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .m-chip { background:#333; border:2px solid transparent; border-radius:10px; color:#aaa; font-size:14px; padding:11px 0; cursor:pointer; text-align:center; transition:all 0.15s; line-height:1.4; }
  .m-chip.sel { border-color:#4ade80; color:#4ade80; background:rgba(74,222,128,0.1); font-weight:600; }
  .m-chip.future { color:#333; pointer-events:none; }
  .m-dot { font-size:8px; color:#555; margin-top:2px; }
  .m-chip.sel .m-dot { color:#4ade80; }

  /* 편집 모달 */
  .edit-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; align-items:flex-end; }
  .edit-overlay.active { display:flex; }
  .edit-sheet { background:#242424; border-radius:24px 24px 0 0; width:100%; max-height:92vh; overflow-y:auto; padding:20px 20px 40px; animation:slideUp 0.28s ease; transition:transform 0.2s ease; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .modal-handle { width:36px; height:4px; background:#444; border-radius:2px; margin:0 auto 20px; cursor:grab; }
  .modal-handle:active { cursor:grabbing; }
  .modal-title  { font-size:18px; font-weight:700; margin-bottom:24px; }
  .edit-list { display:flex; flex-direction:column; gap:10px; }
  .edit-item { background:#2e2e2e; border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .ei-dot  { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .ei-info { flex:1; min-width:0; }
  .ei-name { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ei-sub  { font-size:12px; color:#666; margin-top:2px; }
  .ei-actions { display:flex; gap:8px; flex-shrink:0; }
  .btn-ea { background:#3a3a3a; border:none; border-radius:8px; color:#ccc; font-size:12px; padding:6px 10px; cursor:pointer; }
  .btn-ea.del { color:#ff6b6b; }
  .btn-add { margin-top:16px; width:100%; background:#4ade80; border:none; border-radius:14px; color:#000; font-size:15px; font-weight:700; padding:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .add-form { display:flex; flex-direction:column; gap:14px; }
  .f-label { font-size:13px; color:#888; margin-bottom:4px; }
  .f-input { width:100%; background:#2e2e2e; border:1px solid #3a3a3a; border-radius:10px; color:#fff; font-size:15px; padding:13px 14px; outline:none; transition:border-color 0.2s; -webkit-appearance:none; }
  .f-input:focus { border-color:#4ade80; }
  .f-row { display:flex; flex-direction:column; gap:4px; }
  .cat-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .type-btn { background:#2e2e2e; border:2px solid transparent; border-radius:10px; color:#aaa; font-size:13px; padding:10px 4px; cursor:pointer; text-align:center; transition:all 0.15s; line-height:1.4; }
  .type-btn.active { border-color:#4ade80; color:#4ade80; background:rgba(74,222,128,0.08); }
  .fsec { font-size:12px; color:#555; font-weight:600; padding:6px 0 2px; border-top:1px solid #333; margin-top:2px; }
  .fsec:first-child { border-top:none; margin-top:0; }
  .btn-submit { margin-top:8px; width:100%; background:#4ade80; border:none; border-radius:14px; color:#000; font-size:15px; font-weight:700; padding:16px; cursor:pointer; }
  .btn-cancel { width:100%; background:#333; border:none; border-radius:14px; color:#aaa; font-size:15px; padding:14px; cursor:pointer; margin-top:6px; }

  /* 금액 입력 모달 */
  .amount-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:250; align-items:flex-end; }
  .amount-overlay.active { display:flex; }
  .amount-sheet { background:#242424; border-radius:24px 24px 0 0; width:100%; padding:20px 20px 40px; animation:slideUp 0.28s ease; transition:transform 0.2s ease; }
  .amount-item-name { font-size:15px; color:#888; margin-bottom:16px; text-align:center; }

  /* 카테고리 선택 카드 */
  .cat-select-card { background:#2e2e2e; border-radius:14px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; transition:background 0.15s; margin-bottom:16px; }
  .cat-select-card:active { background:#3a3a3a; }
  .csc-left { display:flex; align-items:center; gap:12px; }
  .csc-label { font-size:13px; color:#888; }
  .csc-value { font-size:15px; font-weight:500; color:#eee; margin-top:2px; }
  .csc-arrow { font-size:18px; color:#555; }

  /* 카테고리 선택 시트 */
  .category-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:260; align-items:flex-end; }
  .category-overlay.active { display:flex; }
  .category-sheet { background:#242424; border-radius:24px 24px 0 0; width:100%; padding:20px 20px 40px; animation:slideUp 0.28s ease; transition:transform 0.2s ease; }
  .category-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; max-height:60vh; overflow-y:auto; }
  .cat-option { background:#2e2e2e; border:2px solid transparent; border-radius:16px; padding:16px 8px; cursor:pointer; text-align:center; transition:all 0.15s; }
  .cat-option:active { transform:scale(0.95); }
  .cat-option.selected { border-color:#4ade80; background:rgba(74,222,128,0.08); }
  .cat-opt-label { font-size:12px; color:#aaa; font-weight:500; line-height:1.3; }
  .cat-option.selected .cat-opt-label { color:#4ade80; }
  .cat-save-btn { width:100%; background:#4ade80; border:none; border-radius:14px; color:#000; font-size:15px; font-weight:700; padding:16px; cursor:pointer; }

  /* 편집 모달 하단 버튼 그리드 */
  .edit-bottom-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .btn-add-half { background:#4ade80; border:none; border-radius:14px; color:#000; font-size:15px; font-weight:700; padding:16px; cursor:pointer; }
  .btn-cancel-half { background:#333; border:none; border-radius:14px; color:#aaa; font-size:15px; font-weight:500; padding:16px; cursor:pointer; }
</style>
</head>
<body>
<div class="header">
  <button class="back-btn" onclick="location.href='asset_manager_mobile.html'">‹</button>
  <span class="header-title">수입</span>
</div>

<button class="month-label-btn" onclick="openMonthSheet()">
  <span class="label-text" id="monthLabelText">—</span>
  <span class="label-arrow">▼</span>
</button>

<div class="total-card">
  <div class="tac-label">이번 달 수입</div>
  <div class="tac-amount" id="totalAmount">—</div>
</div>

<div class="income-list" id="incomeList"></div>

<div class="bottom-nav">
  <button class="nav-btn" onclick="openEditModal()">⚙️ 자산 편집하기</button>
</div>

<!-- 월 선택 시트 -->
<div class="sheet-overlay" id="monthSheet">
  <div class="sheet-inner">
    <div class="sheet-handle"></div>
    <div class="sheet-title">월 선택</div>
    <div class="year-row">
      <button class="year-nav" id="yearPrev" onclick="changeYear(-1)">‹</button>
      <span class="year-lbl" id="yearLabel">—</span>
      <button class="year-nav" id="yearNext" onclick="changeYear(1)">›</button>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </div>
</div>

<!-- 편집 모달 -->
<div class="edit-overlay" id="editOverlay">
  <div class="edit-sheet">
    <div class="modal-handle"></div>
    <div id="editContent"></div>
  </div>
</div>

<!-- 금액 입력 모달 -->
<div class="amount-overlay" id="amountOverlay">
  <div class="amount-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">금액 입력</div>
    <div class="amount-item-name" id="amountItemName">—</div>
    <div class="f-row">
      <div class="f-label"><span id="amountMonthLabel">—</span>월 금액 (원)</div>
      <input class="f-input" id="amountInput" type="text" inputmode="numeric" placeholder="0" oninput="formatNumberInput(this)">
    </div>
    <button class="btn-submit" onclick="saveAmount()">저장하기</button>
    <button class="btn-cancel" onclick="closeAmountModal()">취소</button>
  </div>
</div>

<!-- 카테고리 선택 시트 -->
<div class="category-overlay" id="categoryOverlay">
  <div class="category-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">수입 카테고리 선택</div>
    <div class="category-grid" id="categoryGrid"></div>
    <button class="cat-save-btn" onclick="saveCategorySelection()">저장</button>
  </div>
</div>

<script>
const CATS=[
  {key:'tip',label:'팁',color:'#fbbf24',emoji:'💰',group:'근로소득'},
  {key:'salary',label:'급여',color:'#34d399',emoji:'💳',group:'근로소득'},
  {key:'bonus',label:'상여금',color:'#fbbf24',emoji:'👜',group:'근로소득'},
  {key:'business',label:'사업수입',color:'#fb923c',emoji:'💼',group:'사업소득'},
  {key:'parttime',label:'아르바이트',color:'#a78bfa',emoji:'🏪',group:'근로소득'},
  {key:'allowance',label:'용돈',color:'#34d399',emoji:'💵',group:'기타소득'},
  {key:'finance',label:'금융수입',color:'#60a5fa',emoji:'🏦',group:'금융소득'},
  {key:'insurance',label:'보험금',color:'#60a5fa',emoji:'🛡️',group:'기타소득'},
  {key:'scholarship',label:'장학금',color:'#fbbf24',emoji:'🎓',group:'기타소득'},
  {key:'realestate',label:'부동산',color:'#a78bfa',emoji:'🏘️',group:'금융소득'},
  {key:'resale',label:'중고거래',color:'#60a5fa',emoji:'💱',group:'금융소득'},
  {key:'sns',label:'SNS',color:'#60a5fa',emoji:'💬',group:'사업소득'},
  {key:'apptech',label:'앱테크',color:'#34d399',emoji:'📱',group:'사업소득'},
  {key:'digital',label:'디지털',color:'#a78bfa',emoji:'🎨',group:'사업소득'},
  {key:'etc',label:'기타수입',color:'#94a3b8',emoji:'⋯',group:'기타소득'}
];

const CUR_YEAR = new Date().getFullYear();
const CUR_MONTH = new Date().getMonth()+1;

let meta = JSON.parse(localStorage.getItem('income_meta')||'[]');
let spend = JSON.parse(localStorage.getItem('income_spend')||'{}');

let selY = CUR_YEAR;
let selM = CUR_MONTH;
let sheetY = CUR_YEAR;

let currentItemId = null; // 금액 입력 모달용

function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
function saveMeta(d){ localStorage.setItem('income_meta',JSON.stringify(d)); }
function saveSpend(d){ localStorage.setItem('income_spend',JSON.stringify(d)); }
function fmt(n){ return (n||0).toLocaleString('ko-KR'); }

function renderPage(){
  // 월 라벨
  document.getElementById('monthLabelText').textContent = `${selY}년 ${selM}월`;
  
  const mk = monthKey(selY, selM);
  const curData = spend[mk] || {};
  
  // 총합
  const total = meta.reduce((sum, m) => sum + (curData[m.id] || 0), 0);
  document.getElementById('totalAmount').textContent = fmt(total) + '원';
  
  // 리스트
  const listEl = document.getElementById('incomeList');
  if(meta.length === 0){
    listEl.innerHTML = '<div class="empty-section">수입 항목을 추가해주세요</div>';
    return;
  }
  
  // 대분류별로 그룹핑
  const groups = ['근로소득', '사업소득', '금융소득', '기타소득'];
  let html = '';
  
  groups.forEach(groupName => {
    // 해당 그룹에 속한 항목들 필터링
    const groupItems = meta.filter(m => {
      const cat = CATS.find(c => c.key === m.cat);
      return cat && cat.group === groupName;
    });
    
    if(groupItems.length === 0) return; // 항목이 없으면 스킵
    
    // 그룹 총합
    const groupTotal = groupItems.reduce((sum, m) => sum + (curData[m.id] || 0), 0);
    
    // 그룹 헤더
    html += `
      <div class="group-header">
        <div class="gh-top">
          <div class="gh-title">${groupName}</div>
          <div class="gh-stats">${groupItems.length}개 · ${fmt(groupTotal)}원</div>
        </div>
      </div>
      <div class="income-list" style="padding:0 20px 8px;">
    `;
    
    // 그룹 내 항목들
    groupItems.forEach(m => {
      const cat = CATS.find(c => c.key === m.cat) || CATS[14];
      const amount = curData[m.id] || 0;
      html += `
        <div class="income-item" onclick="openAmountModal(${m.id})">
          <div class="inc-dot" style="background:${cat.color}"></div>
          <div class="inc-info">
            <div class="inc-name">${m.name}</div>
            <div class="inc-sub">${fmt(amount)}원</div>
          </div>
          <div class="inc-amount-wrap">
            <div class="inc-amount">›</div>
          </div>
        </div>
      `;
    });
    
    html += '</div>';
  });
  
  listEl.innerHTML = html;
}

// 월 선택
function openMonthSheet(){ 
  sheetY = selY; 
  renderMonthSheet(); 
  document.getElementById('monthSheet').classList.add('active'); 
}
function closeMonthSheet(){ 
  document.getElementById('monthSheet').classList.remove('active'); 
}
function changeYear(d){ 
  sheetY += d; 
  renderMonthSheet(); 
}
function renderMonthSheet(){
  document.getElementById('yearLabel').textContent = sheetY + '년';
  document.getElementById('yearPrev').disabled = (sheetY <= CUR_YEAR - 5);
  document.getElementById('yearNext').disabled = (sheetY >= CUR_YEAR);
  document.getElementById('monthGrid').innerHTML = Array.from({length:12}, (_, i) => {
    const m = i + 1;
    const future = sheetY === CUR_YEAR && m > CUR_MONTH;
    const isSel = sheetY === selY && m === selM;
    const hasDot = spend[monthKey(sheetY, m)] && Object.values(spend[monthKey(sheetY, m)]).some(v => v > 0);
    return `<button class="m-chip ${isSel?'sel':''} ${future?'future':''}" onclick="pickMonth(${m})">${m}월<div class="m-dot">${hasDot?'●':''}</div></button>`;
  }).join('');
}
function pickMonth(m){ 
  selY = sheetY; 
  selM = m; 
  closeMonthSheet(); 
  renderPage(); 
}

// 편집 모달
function openEditModal(){ 
  showEditMain(); 
  document.getElementById('editOverlay').classList.add('active'); 
}
function closeEditModal(){ 
  document.getElementById('editOverlay').classList.remove('active'); 
}

function showEditMain(){
  const listHTML = meta.length ? meta.map(m => {
    const cat = CATS.find(c => c.key === m.cat) || CATS[5];
    return `
      <div class="edit-item">
        <div class="ei-dot" style="background:${cat.color}"></div>
        <div class="ei-info">
          <div class="ei-name">${m.name}</div>
          <div class="ei-sub">${cat.label}</div>
        </div>
        <div class="ei-actions">
          <button class="btn-ea" onclick="showForm(${m.id})">수정</button>
          <button class="btn-ea del" onclick="deleteItem(${m.id})">삭제</button>
        </div>
      </div>`;
  }).join('') : '<div style="color:#555;font-size:13px;padding:8px 0">수입 항목이 없어요</div>';
  
  document.getElementById('editContent').innerHTML = `
    <div class="modal-title">수입 편집</div>
    <div class="edit-list">${listHTML}</div>
    <div class="edit-bottom-btns">
      <button class="btn-add-half" onclick="showForm(null)">수입 추가</button>
      <button class="btn-cancel-half" onclick="closeEditModal()">취소</button>
    </div>`;
}

function showForm(id){
  const p = id ? meta.find(x => x.id === id) : {};
  const isEdit = !!id;
  
  // 신규 추가 시 "선택하기" 표시, 수정 시 기존 카테고리 표시
  let selectedCat, iconText, labelText;
  if(isEdit && p.cat){
    selectedCat = CATS.find(c => c.key === p.cat) || CATS[14];
    iconText = selectedCat.emoji;
    labelText = selectedCat.label;
  } else {
    selectedCat = CATS[14]; // 기타수입의 ⋯ 아이콘
    iconText = selectedCat.emoji;
    labelText = '선택하기';
  }
  
  document.getElementById('editContent').innerHTML = `
    <div class="modal-title">${isEdit ? '수입 수정' : '수입 추가'}</div>
    <div class="add-form">
      <div class="fsec">수입 분류</div>
      <div class="cat-select-card" onclick="openCategorySheet()">
        <div class="csc-left">
          <div>
            <div class="csc-label">카테고리</div>
            <div class="csc-value" id="selectedCatName">${labelText}</div>
          </div>
        </div>
        <div class="csc-arrow">›</div>
      </div>
      <input type="hidden" id="selectedCatKey" value="${isEdit && p.cat ? p.cat : ''}">
      <div class="fsec">상세 정보</div>
      <div class="f-row">
        <div class="f-label">수입명</div>
        <input class="f-input" id="fName" type="text" placeholder="예) 월급" value="${p.name || ''}">
      </div>
      <button class="btn-submit" onclick="${isEdit ? `updateItem(${id})` : 'addItem()'}">${isEdit ? '저장하기' : '추가하기'}</button>
      <button class="btn-cancel" onclick="showEditMain()">취소</button>
    </div>`;
}

let tempSelectedCat = ''; // 카테고리 시트에서 임시 선택

function openCategorySheet(){
  const currentCat = document.getElementById('selectedCatKey').value;
  tempSelectedCat = currentCat || '';
  
  // 카테고리 그리드 렌더링 (아이콘 없이 라벨만)
  document.getElementById('categoryGrid').innerHTML = CATS.map(c => `
    <div class="cat-option ${c.key === tempSelectedCat ? 'selected' : ''}" onclick="selectCategory('${c.key}')">
      <div class="cat-opt-label">${c.label}</div>
    </div>
  `).join('');
  
  document.getElementById('categoryOverlay').classList.add('active');
}

function closeCategorySheet(){
  document.getElementById('categoryOverlay').classList.remove('active');
}

function selectCategory(key){
  tempSelectedCat = key;
  // 선택 상태 업데이트
  document.querySelectorAll('.cat-option').forEach(opt => {
    opt.classList.remove('selected');
  });
  event.target.closest('.cat-option').classList.add('selected');
}

function saveCategorySelection(){
  const selectedCat = CATS.find(c => c.key === tempSelectedCat) || CATS[0];
  
  // 폼에 반영
  document.getElementById('selectedCatName').textContent = selectedCat.label;
  document.getElementById('selectedCatKey').value = selectedCat.key;
  
  closeCategorySheet();
}

function readForm(){
  const name = document.getElementById('fName').value.trim();
  const cat = document.getElementById('selectedCatKey').value;
  if(!name){ alert('수입명을 입력해주세요.'); return null; }
  if(!cat){ alert('카테고리를 선택해주세요.'); return null; }
  return {name, cat};
}

function addItem(){
  const d = readForm(); 
  if(!d) return;
  
  d.id = Date.now();
  meta.push(d);
  saveMeta(meta);
  
  // 모든 월에 0원으로 자동 초기화
  initAllMonths(d.id);
  
  showEditMain(); 
  renderPage();
}

function updateItem(id){
  const d = readForm(); 
  if(!d) return;
  
  const idx = meta.findIndex(x => Number(x.id) === Number(id));
  if(idx !== -1) meta[idx] = {...meta[idx], ...d};
  saveMeta(meta);
  
  showEditMain(); 
  renderPage();
}

function deleteItem(id){
  if(!confirm('이 수입 항목을 삭제하시겠습니까?')) return;
  
  meta = meta.filter(x => Number(x.id) !== Number(id)); 
  saveMeta(meta);
  
  // 모든 월에서 삭제
  Object.keys(spend).forEach(k => { delete spend[k][id]; }); 
  saveSpend(spend);
  
  showEditMain(); 
  renderPage();
}

// 모든 월에 0원으로 초기화
function initAllMonths(itemId){
  const startYear = CUR_YEAR - 5;
  const endYear = CUR_YEAR;
  
  for(let y = startYear; y <= endYear; y++){
    const maxMonth = (y === CUR_YEAR) ? CUR_MONTH : 12;
    for(let m = 1; m <= maxMonth; m++){
      const mk = monthKey(y, m);
      if(!spend[mk]) spend[mk] = {};
      spend[mk][itemId] = 0;
    }
  }
  saveSpend(spend);
}

// 금액 입력 모달
function openAmountModal(itemId){
  currentItemId = itemId;
  const item = meta.find(m => m.id === itemId);
  if(!item) return;
  
  const mk = monthKey(selY, selM);
  const currentAmount = spend[mk]?.[itemId] || 0;
  
  document.getElementById('amountItemName').textContent = item.name;
  document.getElementById('amountMonthLabel').textContent = `${selY}년 ${selM}`;
  document.getElementById('amountInput').value = currentAmount > 0 ? currentAmount.toLocaleString('ko-KR') : '';
  
  document.getElementById('amountOverlay').classList.add('active');
  
  // 포커스
  setTimeout(() => {
    document.getElementById('amountInput').focus();
  }, 300);
}

function closeAmountModal(){
  document.getElementById('amountOverlay').classList.remove('active');
  currentItemId = null;
}

function saveAmount(){
  if(currentItemId === null) return;
  
  const input = document.getElementById('amountInput');
  const rawValue = input.value.replace(/,/g, '');
  const amount = parseInt(rawValue) || 0;
  
  const mk = monthKey(selY, selM);
  if(!spend[mk]) spend[mk] = {};
  spend[mk][currentItemId] = amount;
  saveSpend(spend);
  
  closeAmountModal();
  renderPage();
}

function formatNumberInput(input){
  let val = input.value.replace(/,/g, '');
  if(val && !isNaN(val)){
    input.value = Number(val).toLocaleString('ko-KR');
  }
}

// 스와이프로 모달 닫기 - 월 선택 시트
(function(){
  let startY = 0, currentY = 0, isDragging = false;
  const overlay = document.getElementById('monthSheet');
  const sheet = overlay?.querySelector('.sheet-inner');
  const handle = overlay?.querySelector('.sheet-handle');
  if(!handle || !sheet || !overlay) return;

  function onStart(e){
    const touch = e.touches ? e.touches[0] : e;
    startY = touch.clientY; 
    currentY = startY; 
    isDragging = true;
    sheet.style.transition = 'none';
  }
  function onMove(e){
    if(!isDragging) return;
    const touch = e.touches ? e.touches[0] : e;
    currentY = touch.clientY;
    const diff = currentY - startY;
    if(diff > 0) sheet.style.transform = `translateY(${diff}px)`;
  }
  function onEnd(){
    if(!isDragging) return;
    isDragging = false;
    sheet.style.transition = 'transform 0.2s ease';
    const diff = currentY - startY;
    if(diff > 100){ closeMonthSheet(); }
    else{ sheet.style.transform = 'translateY(0)'; }
  }

  handle.addEventListener('touchstart', onStart, {passive: true});
  handle.addEventListener('touchmove', onMove, {passive: true});
  handle.addEventListener('touchend', onEnd, {passive: true});
  handle.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', e => { if(isDragging) onMove(e); });
  document.addEventListener('mouseup', onEnd);
})();
