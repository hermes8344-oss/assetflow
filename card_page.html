<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>카드 관리 - AssetFlow</title>
<script src="theme.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #1a1a1a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding-bottom: 200px;
  }

  /* ── 헤더 ── */
  .header {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    position: sticky;
    top: 0;
    background: #1a1a1a;
    z-index: 100;
  }
  .back-btn {
    background: none; border: none;
    color: #fff; font-size: 22px;
    cursor: pointer; padding: 4px 8px 4px 0; line-height: 1;
  }
  .header-title { font-size: 17px; font-weight: 600; margin-left: 4px; }

  /* ── "X월에 쓴 돈" 클릭 가능한 레이블 ── */
  .month-label-btn {
    background: none; border: none;
    padding: 4px 20px 14px;
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; width: 100%;
  }
  .month-label-btn .label-text { font-size: 15px; font-weight: 600; color: #fff; }
  .month-label-btn .label-arrow { font-size: 10px; color: #555; margin-top: 2px; }

  /* ── 카드 리스트 ── */
  .card-list { display: flex; flex-direction: column; }
  .card-item {
    display: flex; align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #2a2a2a;
    cursor: pointer; transition: opacity 0.15s;
  }
  .card-item:last-child { border-bottom: none; }
  .card-item:active { opacity: 0.7; }

  /* 카드 아이콘 - account_page acc-icon과 동일 구조 */
  .card-icon {
    width: 40px; height: 40px; border-radius: 10px;
    margin-right: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; overflow: hidden; color:#fff;
  }
  .card-icon.long { font-size: 9px; }
  .card-icon.extra-long { font-size: 7.5px; }
  .card-kb        { background: #f5c51822; color:#f5c518; }
  .card-toss-black{ background: #33333322; color:#fff; }
  .card-toss-check{ background: #ff704322; color:#ff7043; }
  .card-kfirst    { background: #1a1a2e22; color:#ccc; }
  .card-hipoint   { background: #4a194222; color:#e8c9e5; }
  .card-generic   { background: #88888822; color:#888; }
  .card-label { font-size:inherit; font-weight:700; letter-spacing:-0.3px; text-align:center; line-height:1.2; }

  .card-info { flex:1; min-width:0; }
  .card-name {
    font-size:17px; font-weight:700; color:#fff; letter-spacing:-0.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px;
  }
  .card-sub { font-size:12px; color:#888; }

  .card-amount { text-align:right; flex-shrink:0; margin-left:8px; }
  .card-amount .amount { font-size:15px; font-weight:600; color:#fff; white-space:nowrap; }
  .card-amount .amount.zero { color:#444; }
  .card-input-btn { flex-shrink:0; margin-left:12px; background:#2e2e2e; border:1px solid #3a3a3a; border-radius:8px; color:#aaa; font-size:13px; font-weight:500; padding:6px 14px; pointer-events:none; white-space:nowrap; }

  /* 데이터 없음 */
  .empty-month { text-align:center; padding:48px 0 32px; color:#444; }
  .empty-icon  { font-size:36px; margin-bottom:12px; }
  .empty-text  { font-size:14px; line-height:1.6; }

  /* 합계 카드 */
  .total-card { margin:0 20px 20px; background:#242424; border-radius:16px; padding:20px; }
  .tac-label  { font-size:13px; color:#888; margin-bottom:6px; }
  .tac-amount { font-size:26px; font-weight:700; color:#fff; letter-spacing:-0.3px; white-space:nowrap; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}
  .tac-sub    { font-size:13px; color:#666; margin-top:4px; }

  /* 카테고리 섹션 - account_page와 동일 */
  .section-header { display:flex; align-items:center; justify-content:space-between; padding:20px 20px 8px; }
  .section-title { font-size:13px; color:#888; font-weight:500; }
  .section-total-inline { font-size:26px; font-weight:700; color:#fff; letter-spacing:-0.3px; font-family:-apple-system, ui-rounded, 'Apple SD Gothic Neo', sans-serif;}
  .account-list { padding:0 20px; }

  /* ── 하단 버튼 ── */
  .bottom-nav { position:fixed; bottom:70px; left:0; right:0;
    background:rgba(26,26,26,0.97);
    backdrop-filter:blur(10px);
    padding:12px 20px 28px;
  }
  .nav-btn {
    width:100%; background:#2e2e2e; border:none;
    border-radius:12px; color:#fff;
    font-size:14px; font-weight:500; padding:14px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .nav-btn:active { background:#383838; }

  /* ── 월 선택 바텀시트 ── */
  .sheet-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.7); z-index:600; align-items:flex-end;
  }
  .sheet-overlay.active { display:flex; }
  .sheet-inner {
    background:#242424; border-radius:24px 24px 0 0;
    width:100%; max-height:80vh; overflow-y:auto; padding:20px 20px 86px;
    animation:slideUp 0.25s ease; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; transition:transform 0.2s ease;
  }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .sheet-handle { width:36px; height:4px; background:#444; border-radius:2px; margin:0 auto 20px; }
  .sheet-title  { font-size:16px; font-weight:700; margin-bottom:20px; }

  .year-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .year-nav {
    background:#333; border:none; color:#fff;
    font-size:18px; width:36px; height:36px;
    border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .year-nav:disabled { color:#444; cursor:default; }
  .year-lbl { font-size:16px; font-weight:600; }

  .month-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .m-chip {
    background:#333; border:2px solid transparent;
    border-radius:10px; color:#aaa;
    font-size:14px; padding:11px 0;
    cursor:pointer; text-align:center; transition:all 0.15s; line-height:1.4;
  }
  .m-chip.sel    { border-color:#007aff; color:#007aff; background:rgba(0,122,255,0.1); font-weight:600; }
  .m-chip.future { color:#444; pointer-events:none; }
  .m-dot { font-size:8px; color:#555; margin-top:2px; }
  .m-chip.sel .m-dot { color:#4da3ff; }

  /* ── 편집 모달 ── */
  .fs-overlay-legacy {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.7); z-index:400; align-items:flex-end;
  }
  .fs-overlay-legacy.active { display:flex; }
  .fs-body-legacy {
    background:#242424; border-radius:24px 24px 0 0;
    width:100%; max-height:85vh; overflow-y:auto;
    padding:20px 20px 86px; animation:slideUp 0.28s ease; transition:transform 0.2s ease; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  }
  .modal-handle { width:36px; height:4px; background:#444; border-radius:2px; margin:0 auto 20px; cursor:grab; }
  .modal-handle:active { cursor:grabbing; }
    .modal-title { font-size:17px; font-weight:700; margin-bottom:20px; color:#fff; }

    .edit-list { display:flex; flex-direction:column; gap:10px; margin-bottom:4px; }
  .edit-item {
    background:#2e2e2e; border-radius:14px;
    padding:14px 16px; display:flex; align-items:center; gap:12px;
  }
  .edit-item .card-icon { margin-right:0; }
  .ei-info { flex:1; }
  .ei-name { font-size:14px; font-weight:500; }
  .ei-sub  { font-size:12px; color:#666; margin-top:2px; }
  .ei-actions { display:flex; gap:8px; }
  .btn-ea { background:#3a3a3a; border:none; border-radius:8px; color:#ccc; font-size:12px; padding:6px 10px; cursor:pointer; }
  .btn-ea.del { color:#ff6b6b; }

  .btn-add-card {
    margin-top:16px; width:100%;
    background:#007aff; border:none; border-radius:14px;
    color:#fff; font-size:15px; font-weight:600; padding:16px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }

  /* 폼 */
  .add-form { display:flex; flex-direction:column; gap:14px; }
  .f-label  { font-size:13px; color:#888; margin-bottom:4px; }
  .f-input  {
    width:100%; background:#2e2e2e; border:1px solid #3a3a3a;
    border-radius:10px; color:#fff; font-size:15px;
    padding:13px 14px; outline:none; transition:border-color 0.2s;
  }
  .f-input:focus { border-color:#007aff; }
  .type-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .type-btn {
    background:#2e2e2e; border:2px solid transparent;
    border-radius:10px; color:#aaa; font-size:14px;
    padding:12px; cursor:pointer; text-align:center; transition:all 0.15s;
  }
  .type-btn.active { border-color:#007aff; color:#007aff; background:rgba(0,122,255,0.08); }
  .f-row { display:flex; flex-direction:column; gap:4px; }
  .btn-submit {
    margin-top:8px; width:100%;
    background:#007aff; border:none; border-radius:14px;
    color:#fff; font-size:15px; font-weight:600; padding:16px; cursor:pointer;
  }
  .btn-cancel {
    width:100%; background:#333; border:none; border-radius:14px;
    color:#aaa; font-size:15px; padding:14px; cursor:pointer; margin-top:6px;
  }

  .month-trash-btn { background:none; border:none; color:#555; font-size:18px; cursor:pointer; padding:4px 8px; line-height:1; transition:color 0.15s; display:flex; align-items:center; justify-content:center; }
  .month-trash-btn:active { color:#888; }
  .trash-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:500; align-items:center; justify-content:center; padding:0 24px; }
  .trash-overlay.active { display:flex; }
  .trash-sheet { background:#1e1e1e; border-radius:20px; width:100%; max-width:340px; padding:28px 24px 20px; animation:popIn 0.2s ease; }
  @keyframes popIn { from{transform:scale(0.92);opacity:0} to{transform:scale(1);opacity:1} }
  .trs-icon  { font-size:34px; text-align:center; margin-bottom:12px; }
  .trs-title { font-size:17px; font-weight:700; text-align:center; margin-bottom:8px; }
  .trs-desc  { font-size:14px; color:#888; text-align:center; line-height:1.6; margin-bottom:20px; }
  .trs-desc strong { color:#f87171; }
  .trs-btns  { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .trs-cancel  { background:#2a2a2a; border:none; border-radius:12px; color:#aaa; font-size:15px; padding:14px; cursor:pointer; }
  .trs-confirm { background:#f8717122; border:2px solid #f87171; border-radius:12px; color:#f87171; font-size:15px; font-weight:700; padding:14px; cursor:pointer; }

  /* ── 풀스크린 편집 ── */
  .fs-overlay {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: #1a1a1a;
    transform: translateY(100%);
    transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .fs-overlay.active {
    display: block;
    transform: translateY(0);
  }
  .fs-header {
    display: flex; align-items: center; justify-content: center;
    padding: 16px 20px 12px;
    position: sticky; top: 0; background: #1a1a1a; z-index: 10;
    border-bottom: 0.5px solid #2a2a2a;
  }
  .fs-title {
    font-size: 15px; font-weight: 600; color: #fff;
    font-family: -apple-system, sans-serif;
    flex: 1; text-align: center;
  }
  .fs-body { padding: 20px 20px 100px; }
  /* 추가/저장 버튼 */
  .btn-add, .btn-add-acc, .btn-add-card, .btn-submit {
    background: #007aff !important; color: #fff !important;
    border: none; border-radius: 14px;
    font-size: 15px; font-weight: 600; padding: 16px;
    cursor: pointer; width: 100%; margin-top: 8px;
    font-family: -apple-system, sans-serif;
  }
  .btn-add:active, .btn-add-acc:active, .btn-add-card:active, .btn-submit:active {
    opacity: 0.85;
  }
  /* 취소 버튼 */
  .btn-cancel, .btn-cancel-half {
    background: #2e2e2e !important; color: #888 !important;
    border: none; border-radius: 14px;
    font-size: 15px; padding: 14px;
    cursor: pointer; width: 100%; margin-top: 6px;
    font-family: -apple-system, sans-serif;
  }


  /* ── 바텀탭 ── */
  .bottom-tab-bar {
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(20,20,20,0.97);
    border-top:1px solid #2a2a2a;
    display:flex; padding:10px 0 28px;
    z-index:200;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .tab-item {
    flex:1; display:flex; flex-direction:column;
    align-items:center; gap:3px;
    cursor:pointer; padding:4px 0;
    background:none; border:none; color:inherit;
  }
  .tab-item-label { font-size:12px; color:#555; font-weight:500; letter-spacing:-0.2px; }
  .tab-item.active .tab-item-label { color:#fff; }
  .tab-item-dot { width:4px; height:4px; border-radius:50%; background:transparent; margin-bottom:1px; }
  .tab-item.active .tab-item-dot { background:#fff; }

  .more-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; display:none; align-items:flex-end; }
  .more-overlay.active { display:flex; }
  .more-sheet { background:#1a1a1a; border-radius:20px 20px 0 0; width:100%; padding:20px 20px 36px; }
  .more-handle { width:40px; height:4px; background:#333; border-radius:2px; margin:0 auto 18px; }
  .more-sec-title { font-size:11px; color:#555; font-weight:600; letter-spacing:0.05em; padding:0 2px 10px; }
  .more-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
  .more-grid-item {
    background:#242424; border-radius:10px;
    padding:12px 6px; text-align:center;
    font-size:13px; font-weight:500; color:#ddd;
    cursor:pointer; border:none;
    font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;
  }
  .more-grid-item:active { background:#2e2e2e; color:#fff; }


  /* ── 바텀탭 ── */
  .bottom-tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(15,15,15,0.98);
    border-top: 1px solid #222;
    display: flex; padding: 10px 0 28px;
    z-index: 1500;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    cursor: pointer; padding: 4px 0;
    background: none; border: none; color: inherit;
  }
  .tab-item-label { font-size: 12px; color: #555; font-weight: 500; letter-spacing: -0.2px; }
  .tab-item.active .tab-item-label { color: #fff; }
  .tab-item-dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; margin-bottom: 1px; }
  .tab-item.active .tab-item-dot { background: #fff; }
  .more-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; display:none; align-items:flex-end; }
  .more-overlay.active { display:flex; }
  .more-sheet { background:#1a1a1a; border-radius:20px 20px 0 0; width:100%; padding:20px 20px 36px; }
  .more-handle { width:40px; height:4px; background:#333; border-radius:2px; margin:0 auto 18px; }
  .more-sec-title { font-size:11px; color:#555; font-weight:600; letter-spacing:0.05em; padding:0 2px 10px; }
  .more-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
  .more-grid-item {
    background:#242424; border-radius:10px;
    padding:12px 6px; text-align:center;
    font-size:13px; font-weight:500; color:#ddd;
    cursor:pointer; border:none;
    font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;
  }
  .more-grid-item:active { background:#2e2e2e; color:#fff; }


  /* ── 토스트 알림 ── */
  .toast-msg {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: rgba(50,50,50,0.97); color: #fff;
    font-size: 13px; font-weight: 500;
    padding: 11px 20px; border-radius: 20px;
    white-space: nowrap; z-index: 9999;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    font-family: -apple-system, sans-serif;
  }
  .toast-msg.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }
  /* ── 인라인 확인 (confirm 대체) ── */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 9000; display: none; align-items: center; justify-content: center; padding: 0 40px;
  }
  .confirm-overlay.active { display: flex; }
  .confirm-box {
    background: #242424; border-radius: 16px; padding: 24px 20px 16px; width: 100%; max-width: 300px;
  }
  .confirm-msg { font-size: 15px; color: #fff; text-align: center; margin-bottom: 20px; line-height: 1.5; font-family: -apple-system, sans-serif; }
  .confirm-btns { display: flex; gap: 8px; }
  .confirm-cancel { flex: 1; background: #333; border: none; border-radius: 10px; color: #888; font-size: 15px; padding: 12px; cursor: pointer; font-family: -apple-system, sans-serif; }
  .confirm-ok { flex: 1; background: #f87171; border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; padding: 12px; cursor: pointer; font-family: -apple-system, sans-serif; }


  /* ── 사용자 뱃지 ── */
  .user-badge {
    font-size: 11px; font-weight: 500;
    padding: 3px 8px; border-radius: 10px;
    background: rgba(77,163,255,0.15);
    color: #4da3ff; margin-left: 6px;
    display: none;
  }
  .user-badge.show { display: inline-block; }


  /* ── 설정 시트 ── */
  .settings-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2100; display:none; align-items:flex-end; }
  .settings-overlay.active { display:flex; }
  .settings-sheet { background:#1e1e1e; border-radius:20px 20px 0 0; width:100%; padding:20px 20px 40px; }
  .settings-handle { width:40px; height:4px; background:#444; border-radius:2px; margin:0 auto 20px; }
  .settings-title { font-size:16px; font-weight:600; text-align:center; margin-bottom:20px; }
  .settings-list { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .settings-item { display:flex; align-items:center; gap:14px; background:#242424; border-radius:14px; padding:16px; cursor:pointer; border:none; width:100%; text-align:left; font-family:-apple-system,"Apple SD Gothic Neo",sans-serif; }
  .settings-item:active { background:#2e2e2e; }
  .settings-item-icon { font-size:20px; width:28px; text-align:center; }
  .settings-item-text { display:flex; flex-direction:column; gap:3px; }
  .settings-item-title { font-size:15px; font-weight:500; color:#eee; }
  .settings-item-desc { font-size:12px; color:#666; }
  .settings-close { width:100%; background:#333; border:none; border-radius:12px; color:#fff; font-size:15px; padding:14px; cursor:pointer; margin-top:4px; }

  /* ── 이름 설정 모달 ── */
  .name-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2200; display:none; align-items:flex-end; }
  .name-overlay.active { display:flex; }
  .name-sheet { background:#1e1e1e; border-radius:20px 20px 0 0; width:100%; padding:20px; }
  .ns-handle { width:40px; height:4px; background:#444; border-radius:2px; margin:0 auto 20px; }
  .ns-title { font-size:16px; font-weight:600; text-align:center; margin-bottom:20px; }
  .ns-form { display:flex; flex-direction:column; gap:16px; margin-bottom:20px; }
  .ns-label { font-size:13px; color:#888; margin-bottom:6px; }
  .ns-input { width:100%; background:#242424; border:1px solid #333; border-radius:10px; color:#fff; font-size:15px; padding:12px; }
  .ns-input:focus { outline:none; border-color:#007aff; }
  .ns-btn-row { display:flex; gap:10px; }
  .ns-cancel, .ns-save { flex:1; border:none; border-radius:10px; font-size:15px; padding:12px; cursor:pointer; }
  .ns-cancel { background:#333; color:#fff; }
  .ns-save { background:#007aff; color:#fff; }
  /* ── 초기화 모달 ── */
  .reset-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:2200; display:none; align-items:center; justify-content:center; }
  .reset-overlay.active { display:flex; }
  .reset-sheet { background:#1e1e1e; border-radius:20px; width:90%; max-width:400px; padding:30px 24px; }
  .rs-icon { font-size:48px; text-align:center; margin-bottom:16px; }
  .rs-title { font-size:18px; font-weight:600; text-align:center; margin-bottom:12px; }
  .rs-desc { font-size:14px; color:#aaa; text-align:center; line-height:1.6; margin-bottom:24px; }
  .rs-input-wrap { margin-bottom:24px; }
  .rs-input { width:100%; background:#242424; border:1px solid #333; border-radius:10px; color:#fff; font-size:15px; padding:12px; text-align:center; }
  .rs-input:focus { outline:none; border-color:#007aff; }
  .rs-btns { display:flex; gap:10px; }
  .rs-cancel, .rs-confirm { flex:1; border:none; border-radius:10px; font-size:15px; padding:12px; cursor:pointer; }
  .rs-cancel { background:#333; color:#fff; }
  .rs-confirm { background:#f87171; color:#fff; }
  .rs-step2 { display:none; }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="location.href='asset_manager_mobile.html'">‹</button>
  <span class="header-title">카드</span><span class="user-badge" id="userBadge"></span>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;padding:0 20px 14px">
  <button style="background:none;border:none;display:flex;align-items:center;gap:6px;cursor:pointer" onclick="openMonthSheet()">
    <span id="monthLabelText" style="font-size:15px;font-weight:600;color:#fff">—</span>
    <span style="font-size:10px;color:#555">▼</span>
  </button>
</div>

<!-- 총 지출 카드 -->
<div class="total-card">
  <div class="tac-label" id="totalLabel">이번 달 총 지출</div>
  <div class="tac-amount" id="totalValue">—</div>
  <div class="tac-sub" id="totalSub">—</div>
</div>

<div class="card-list" id="cardList"></div>

<div class="bottom-nav">
  <button class="nav-btn" onclick="openEditModal()">카드 편집하기</button>
</div>

<!-- 월 선택 시트 -->
<div class="sheet-overlay" id="monthSheetOv" onclick="if(event.target===this)closeMonthSheet()">
  <div class="sheet-inner">
    <div class="sheet-title">월 선택</div>
    <div class="year-row">
      <button class="year-nav" id="yearPrev" onclick="changeYear(-1)">‹</button>
      <span class="year-lbl" id="sheetYearLbl"></span>
      <button class="year-nav" id="yearNext" onclick="changeYear(1)">›</button>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </div>
</div>


<!-- 월별 초기화 모달 -->
<div class="trash-overlay" id="trashOverlay" onclick="if(event.target===this)closeTrashModal()">
  <div class="trash-sheet">
    <div class="trs-icon">🗑️</div>
    <div class="trs-title" id="trsTitle">이 달 데이터 초기화</div>
    <div class="trs-desc"  id="trsDesc">—</div>
    <button id="trsHideBtn" onclick="confirmHide()" style="display:none;width:100%;margin-bottom:8px;background:#2e2e2ebb;border:2px solid #555;border-radius:12px;color:#fff;font-size:15px;font-weight:600;padding:14px;cursor:pointer">이번 달만 숨기기</button>
    <div class="trs-btns">
      <button class="trs-cancel"  onclick="closeTrashModal()">취소</button>
      <button class="trs-confirm" onclick="confirmTrash()">완전 삭제</button>
    </div>
  </div>
</div>

<!-- 카드사 선택 시트 -->
<div class="sheet-overlay" id="cardCompanySheet" onclick="if(event.target===this)closeCardCompanySheet()">
  <div class="sheet-inner">
    <div class="sheet-title">카드사 선택</div>
    
    <div style="margin-bottom:12px">
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px" id="cardCompanyList"></div>
    </div>
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      <button style="background:#2e2e2e;border:none;border-radius:12px;color:#888;font-size:14px;padding:14px;cursor:pointer;width:100%;font-family:-apple-system,sans-serif;" onclick="selectDirectCardInput()">✏️ 직접입력</button>
      <button style="background:#2e2e2e;border:none;border-radius:12px;color:#888;font-size:14px;padding:14px;cursor:pointer;width:100%;font-family:-apple-system,sans-serif;" onclick="closeCardCompanySheet()">취소</button>
    </div>
  </div>
</div>

<!-- 편집 모달 -->
<div class="fs-overlay" id="fsOverlay" >
  <div class="fs-body">
    <div class="fs-header">
    <div class="fs-title">카드 편집</div>
    
  </div>
  <div id="editContent"></div>
  </div>
</div>

<!-- 빠른 입력 모달 -->
<div class="fs-overlay" id="quickEditOverlay" onclick="if(event.target===this)closeQuickEdit()">
  <div class="fs-body">
    <div class="fs-header">
    <div class="fs-title">카드 편집</div>
    
  </div>
  <div id="quickEditContent"></div>
  </div>
</div>

<script>

/* ── 토스트 & 확인 다이얼로그 ── */
function showToast(msg, duration=2000){
  const el = document.getElementById('toastMsg');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), duration);
}
let confirmResolve = null;
function showConfirm(msg){
  return new Promise(resolve => {
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmOverlay').classList.add('active');
    confirmResolve = (result) => {
      document.getElementById('confirmOverlay').classList.remove('active');
      resolve(result);
    };
  });
}


/* ── 사용자 prefix 시스템 ── */
function getPrefix(){
  return localStorage.getItem('af_active_prefix')||'u1_';
}
function pk(key){ return getPrefix()+key; }
const NOW = new Date();
const CUR_YEAR = NOW.getFullYear(), CUR_MONTH = NOW.getMonth()+1;
function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }

/* ── 전체 월 키 생성 (최근 5년) ── */
function getAllMonthKeys(){
  const keys = [];
  for(let y = CUR_YEAR - 5; y <= CUR_YEAR; y++){
    const maxM = (y === CUR_YEAR) ? CUR_MONTH : 12;
    for(let m = 1; m <= maxM; m++){
      keys.push(monthKey(y, m));
    }
  }
  return keys;
}

const CARD_COMPANIES = [
  '삼성카드', '현대카드', '신한카드', 'KB국민카드', '우리카드', '하나카드',
  '롯데카드', 'BC카드', 'NH농협카드', '씨티카드', 'IBK기업은행카드',
  '카카오뱅크', '토스뱅크', '케이뱅크', 'SC제일은행'
];

const DEFAULT_META = [];
const k0=monthKey(CUR_YEAR,CUR_MONTH);
const k1=CUR_MONTH===1?monthKey(CUR_YEAR-1,12):monthKey(CUR_YEAR,CUR_MONTH-1);
const k2=CUR_MONTH<=2?monthKey(CUR_YEAR-1,CUR_MONTH+10):monthKey(CUR_YEAR,CUR_MONTH-2);
const DEFAULT_SPEND = {};

function loadMeta()   { try{const s=localStorage.getItem(pk('af_cards_meta'));  return s?JSON.parse(s):DEFAULT_META;}  catch{return DEFAULT_META;} }
function saveMeta(d)  { localStorage.setItem(pk('af_cards_meta'),JSON.stringify(d)); }
function loadSpend()  { try{const s=localStorage.getItem(pk('af_cards_spend')); return s?JSON.parse(s):DEFAULT_SPEND;} catch{return DEFAULT_SPEND;} }
function saveSpend(d) { localStorage.setItem(pk('af_cards_spend'),JSON.stringify(d)); }
function loadHidden() { try{const s=localStorage.getItem(pk('af_cards_hidden')); return s?JSON.parse(s):{};} catch{return {};} }
function saveHidden(d){ localStorage.setItem(pk('af_cards_hidden'),JSON.stringify(d)); }

let meta=loadMeta(), spend=loadSpend(), hidden=loadHidden();
let selY=CUR_YEAR, selM=CUR_MONTH, sheetY=CUR_YEAR;

function renderPage(){
  const isCur=(selY===CUR_YEAR&&selM===CUR_MONTH);
  document.getElementById('monthLabelText').textContent=`${selM}월에 쓴 돈`;
  document.getElementById('totalLabel').textContent=isCur?'이번 달 총 지출':`${selY}년 ${selM}월 총 지출`;
  const ms=spend[monthKey(selY,selM)]||{};
  const hiddenIds = hidden[monthKey(selY,selM)] || [];

  // 해당 월에 데이터가 있는 카드들 (숨긴 항목 제외)
  const cardsWithData = meta.filter(c => ms[c.id] !== undefined && !hiddenIds.includes(c.id));
  const rows = cardsWithData.map(c=>({...c,amount:ms[c.id]||0}));

  const total = rows.reduce((s,c)=>s+c.amount,0);
  document.getElementById('totalValue').textContent=fmt(total);
  document.getElementById('totalSub').textContent=`총 ${rows.length}개 카드`;

  const el=document.getElementById('cardList');
  if(!rows.length){
    el.innerHTML=`<div style="text-align:center;padding:60px 0 32px;color:#555;font-size:14px">등록된 카드가 없어요<br><span style="font-size:12px;color:#444">카드 편집하기에서 추가해보세요</span></div>`;
    document.getElementById('totalValue').textContent='0원'; return;
  }

  // 카드 종류 순서
  const CARD_TYPES = ['체크카드','신용카드','선불카드','법인카드'];
  let html = '';
  CARD_TYPES.forEach(type=>{
    const group = rows.filter(c=>c.type===type).sort((a,b)=>b.amount-a.amount);
    if(!group.length) return;
    const sub = group.reduce((s,c)=>s+c.amount,0);
    html += `
      <div class="section-header">
        <div style="display:flex;flex-direction:column;gap:2px">
          <span class="section-title">${type}</span>
          <span class="section-total-inline">${fmt(sub)}</span>
        </div>
      </div>
      <div class="account-list">
        ${group.map(c=>{
            const {label, sizeClass, bg, text} = getCardIcon(c);
            return `
          <div class="card-item" onclick="quickEdit(${c.id})">
            <div class="card-icon card-generic ${sizeClass}" style="background:${bg};color:${text}">${label}</div>
            <div class="card-info"><div class="card-name">${fmt(c.amount)}</div><div class="card-sub">${c.name}</div></div>
            <div class="card-input-btn">입력</div>
          </div>`;
          }).join('')}
      </div>`; 
  });
  el.innerHTML=html;
}
function getCardIcon(c){
  const company = c.company || c.name || '';
  let label;
  if(company.startsWith('IBK')) label = 'IBK';
  else if(company.startsWith('카카오')) label = '카카오';
  else label = company.slice(0,2);
  const sizeClass = label.length >= 3 ? 'extra-long' : '';

  const BRAND_COLORS = {
    '삼성카드':      { bg:'#0057a8', text:'#fff' },
    '현대카드':      { bg:'#000000', text:'#fff' },
    '신한카드':      { bg:'#0046a0', text:'#fff' },
    'KB국민카드':    { bg:'#f5c518', text:'#000' },
    '우리카드':      { bg:'#007b40', text:'#fff' },
    '하나카드':      { bg:'#008549', text:'#fff' },
    '롯데카드':      { bg:'#ed1c24', text:'#fff' },
    'BC카드':        { bg:'#e4002b', text:'#fff' },
    'NH농협카드':    { bg:'#008434', text:'#fff' },
    '씨티카드':      { bg:'#003da5', text:'#fff' },
    'IBK기업은행카드':{ bg:'#005bac', text:'#fff' },
    '카카오뱅크':    { bg:'#fee500', text:'#000' },
    '토스뱅크':      { bg:'#0064ff', text:'#fff' },
    '케이뱅크':      { bg:'#7c3aed', text:'#fff' },
    'SC제일은행':    { bg:'#1428a0', text:'#fff' },
  };

  const matched = Object.keys(BRAND_COLORS).find(k => company.startsWith(k) || k.startsWith(company.slice(0,2)));
  const brand = BRAND_COLORS[company] || (matched ? BRAND_COLORS[matched] : null);
  const bg   = brand ? brand.bg+'33' : '#88888822';
  const text = brand ? brand.text === '#fff' ? '#ccc' : brand.text : '#888';

  return {label, sizeClass, bg, text};
}
function fmt(n){ return n.toLocaleString('ko-KR')+'원'; }

/* ── 빠른 입력 모달 ── */
function quickEdit(id){
  const c = meta.find(x => x.id === id);
  if(!c) return;
  const cur = (spend[monthKey(selY,selM)] || {})[id] || 0;
  
  document.getElementById('quickEditContent').innerHTML = `
    <div class="modal-title">${c.name}</div>
    <div class="add-form">
      <div class="f-row">
        <div class="f-label">${selM}월 지출액 (원)</div>
        <input class="f-input" id="quickSpent" type="text" inputmode="numeric" 
               value="${cur ? cur.toLocaleString('ko-KR') : ''}" 
               oninput="formatNumberInput(this)" 
               autofocus>
      </div>
      <button class="btn-submit" onclick="saveQuickEdit(${id})">저장</button>
      <button class="btn-cancel" onclick="closeQuickEdit()">취소</button>
    </div>
  `;
  
  document.getElementById('quickEditOverlay').classList.add('active');
  
  // autofocus 강제 실행
  setTimeout(() => {
    const input = document.getElementById('quickSpent');
    if(input) {
      input.focus();
      input.select();
    }
  }, 100);
}

function closeQuickEdit(){
  const overlay = document.getElementById('quickEditOverlay');
  const sheet = overlay?.querySelector('.fs-body-legacy');
  
  // transform 초기화
  if(sheet){
    sheet.style.transform = 'translateY(0)';
    sheet.style.transition = '';
  }
  
  overlay.classList.remove('active');
}

function saveQuickEdit(id){
  const amtStr = document.getElementById('quickSpent').value.replace(/,/g,'');
  const amt = parseInt(amtStr) || 0;
  const k = monthKey(selY, selM);
  if(!spend[k]) spend[k] = {};
  spend[k][id] = amt;
  saveSpend(spend);
  closeQuickEdit();
  renderPage();
}

function openMonthSheet(){ sheetY=selY; renderSheetGrid(); document.getElementById('monthSheetOv').classList.add('active'); }
function closeMonthSheet(){ document.getElementById('monthSheetOv').classList.remove('active'); }
function changeYear(d){ sheetY=Math.min(CUR_YEAR,sheetY+d); renderSheetGrid(); }
function renderSheetGrid(){
  document.getElementById('sheetYearLbl').textContent=sheetY+'년';
  document.getElementById('yearPrev').disabled=(sheetY<=CUR_YEAR-5);
  document.getElementById('yearNext').disabled=(sheetY>=CUR_YEAR);
  document.getElementById('monthGrid').innerHTML=Array.from({length:12},(_,i)=>{
    const m=i+1;
    const future=sheetY===CUR_YEAR&&m>CUR_MONTH;
    const isSel=sheetY===selY&&m===selM;
    const hasDot=spend[monthKey(sheetY,m)]&&Object.values(spend[monthKey(sheetY,m)]).some(v=>v>0);
    return `<button class="m-chip ${isSel?'sel':''} ${future?'future':''}" onclick="pickMonth(${m})">${m}월<div class="m-dot">${hasDot?'●':''}</div></button>`;
  }).join('');
}
function pickMonth(m){ selY=sheetY; selM=m; closeMonthSheet(); renderPage(); }

let _trashCb = null, _hideCb = null;
function openTrashModal(title, desc, cb, hideCb){ document.getElementById('trsTitle').textContent=title; document.getElementById('trsDesc').innerHTML=desc; _trashCb=cb; _hideCb=hideCb||null; const hideBtn=document.getElementById('trsHideBtn'); if(hideBtn) hideBtn.style.display=_hideCb?'block':'none'; document.getElementById('trashOverlay').classList.add('active'); }
function closeTrashModal(){ document.getElementById('trashOverlay').classList.remove('active'); _trashCb=null; _hideCb=null; }
function confirmTrash(){ if(_trashCb)_trashCb(); closeTrashModal(); }
function confirmHide(){ if(_hideCb)_hideCb(); closeTrashModal(); }

function openMonthTrash(){
  const mk = monthKey(selY, selM);
  const hasData = spend[mk] && Object.values(spend[mk]).some(v=>v>0);
  if(!hasData){ showToast(selM+'월에 입력된 지출이 없어요.'); return; }
  openTrashModal(
    selM+'월 카드 지출 초기화',
    `<strong>${selY}년 ${selM}월</strong>에 입력된<br>모든 카드 지출이 삭제돼요.`,
    ()=>{ delete spend[monthKey(selY,selM)]; saveSpend(spend); renderPage(); }
  );
}

function openEditModal(){ 
  showEditMain(); 
  document.getElementById('fsOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
  document.body.style.top = `-${window.scrollY}px`;
}
function closeEditModal(){ 
  const overlay = document.getElementById('fsOverlay');
  const sheet = overlay?.querySelector('.fs-body-legacy');
  
  // transform 초기화
  if(sheet){
    sheet.style.transform = 'translateY(0)';
    sheet.style.transition = '';
  }
  
  overlay.classList.remove('active');
  
  const scrollY = document.body.style.top;
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
  document.body.style.top = '';
  window.scrollTo(0, parseInt(scrollY || '0') * -1);
}
function showEditMain(){
  const mk = monthKey(selY, selM);
  const hiddenIds = hidden[mk] || [];
  const hiddenCards = meta.filter(c => hiddenIds.includes(c.id));
  let hiddenHtml = '';
  if(hiddenCards.length){
    hiddenHtml = `
      <div style="font-size:12px;color:#555;padding:16px 0 8px;border-top:1px solid #2a2a2a;margin-top:8px">${selM}월 숨긴 항목 (${hiddenCards.length}개)</div>
      ${hiddenCards.map(c=>{
        const {label, sizeClass, bg, text} = getCardIcon(c);
        return `
        <div class="edit-item" style="opacity:0.6">
          <div class="card-icon card-generic ${sizeClass}" style="margin-right:0;background:${bg};color:${text}">${label}</div>
          <div class="ei-info"><div class="ei-name">${c.name}</div><div class="ei-sub">${c.type}</div></div>
          <div class="ei-actions">
            <button class="btn-ea" onclick="restoreCard(${c.id})">복원</button>
          </div>
        </div>`;
      }).join('')}`;
  }

  const hasCards = meta.length > 0;

  document.getElementById('editContent').innerHTML=`
    <div class="edit-list" id="editList">
      ${!hasCards ? '<div style="color:#555;font-size:13px;text-align:center;padding:40px 0">등록된 카드가 없어요<br><span style="font-size:12px;color:#444">아래 추가하기로 카드를 등록해보세요</span></div>' : ''}
    </div>
    ${hiddenHtml}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px">
      <button class="btn-add-card" style="margin-top:0" onclick="showAddForm()">＋ 카드 추가하기</button>
      <button onclick="closeEditModal()" style="background:#2e2e2e;border:none;border-radius:14px;color:#aaa;font-size:14px;font-weight:500;padding:14px;cursor:pointer;font-family:-apple-system,sans-serif;">취소</button>
    </div>`;
  if(hasCards) document.getElementById('editList').innerHTML=meta.map(c=>{
    const {label, sizeClass, bg, text} = getCardIcon(c);
    return `
    <div class="edit-item">
      <div class="card-icon card-generic ${sizeClass}" style="margin-right:0;background:${bg};color:${text}">${label}</div>
      <div class="ei-info"><div class="ei-name">${c.name}</div><div class="ei-sub">${c.type}</div></div>
      <div class="ei-actions">
        <button class="btn-ea" onclick="showEditForm(${c.id})">수정</button>
        <button class="btn-ea del" onclick="deleteCard(${c.id})">삭제</button>
      </div>
    </div>`;
  }).join('');
}
function showAddForm(){
  document.getElementById('editContent').innerHTML=`
    <div class="modal-title">카드 추가</div>
    <div class="add-form">
      <div class="f-row"><div class="f-label">카드 종류</div>
        <div class="type-grid" id="typeGrid">
          ${['체크카드','신용카드','선불카드','법인카드'].map((t,i)=>`<button class="type-btn ${i===0?'active':''}" data-type="${t}" onclick="selType(this)">${t}</button>`).join('')}
        </div></div>
      <div class="f-row"><div class="f-label">카드명</div><input class="f-input" id="newName" type="text" placeholder="예) 토스뱅크 체크카드" enterkeyhint="done"></div>
      <div class="f-row">
        <div class="f-label">카드사</div>
        <button class="f-input" id="newCompany" type="button" onclick="openCardCompanySheet()" style="text-align:left;cursor:pointer;color:#888">선택하기</button>
      </div>
      <button class="btn-submit" onclick="addCardNoAmount()">추가하기</button>
      <button class="btn-cancel" onclick="showEditMain()">취소</button>
    </div>`;
}
function selType(btn){ document.querySelectorAll('#typeGrid .type-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }

function addCardNoAmount(){
  const name=document.getElementById('newName').value.trim();
  const company=document.getElementById('newCompany').textContent.trim();
  const type=document.querySelector('#typeGrid .type-btn.active')?.dataset.type||'체크카드';
  if(!name){showToast('카드명을 입력해주세요.');return;}
  if(!company || company==='선택하기'){showToast('카드사를 선택해주세요.');return;}
  const id=Date.now();
  meta.push({id,name,company,type,color:'card-generic',label:name.slice(0,4)});
  saveMeta(meta);
  
  // 전체 기간에 0원 자동 추가

  openTrashModal(
    `"${c.name}" 삭제`,
    `<strong style="color:#fff">${selY}년 ${selM}월만 숨기기</strong><br>다른 달 데이터는 유지돼요.<br><br>또는 <strong style="color:#f87171">모든 월 완전 삭제</strong>를 선택하세요.`,

// 편집 모달
(function(){
  let startY=0, currentY=0, isDragging=false;
  const overlay = document.getElementById('fsOverlay');
  const sheet   = overlay?.querySelector('.fs-body-legacy');
  const handle  = overlay?.querySelector('.modal-handle');
  if(!handle||!sheet||!overlay) return;

  function onStart(e){
    const touch = e.touches?e.touches[0]:e;
    startY = touch.clientY; currentY = startY; isDragging = true;
    sheet.style.transition = 'none';
  }
  function onMove(e){
    if(!isDragging) return;
    const touch = e.touches?e.touches[0]:e;
    currentY = touch.clientY;
    const diff = currentY - startY;
    if(diff>0) sheet.style.transform = `translateY(${diff}px)`;
  }
  function onEnd(){
    if(!isDragging) return;
    isDragging = false;
    sheet.style.transition = 'transform 0.2s ease';
    const diff = currentY - startY;
    if(diff>100){ closeEditModal(); }
    else{ sheet.style.transform = 'translateY(0)'; }
  }

  handle.addEventListener('touchstart', onStart, {passive:true});
  handle.addEventListener('touchmove',  onMove,  {passive:true});
  handle.addEventListener('touchend',   onEnd,   {passive:true});
  handle.addEventListener('mousedown',  onStart);
  document.addEventListener('mousemove', e=>{ if(isDragging) onMove(e); });
  document.addEventListener('mouseup',   onEnd);
})();

        <strong>완전히 삭제</strong>돼요.<br>삭제 후 복구가 불가능해요.
      </div>
      <div class="rs-btns">
        <button class="rs-cancel" onclick="closeResetModal()">취소</button>
        <button class="rs-confirm" onclick="goStep2()">계속 진행하기</button>
      </div>
    </div>
    <div id="rsStep2" class="rs-step2">
      <div class="rs-title">정말 삭제할까요?</div>
      <div class="rs-desc">확인을 위해 아래에 <strong>"삭제"</strong>를 입력해주세요</div>
      <div class="rs-input-wrap">
        <input class="rs-input" id="rsConfirmInput" type="text" placeholder="삭제" oninput="checkResetInput()">
      </div>
      <div class="rs-btns">
        <button class="rs-cancel" onclick="backStep1()">뒤로</button>
        <button class="rs-confirm" id="rsFinalBtn" onclick="executeReset()" disabled style="opacity:0.4">초기화 실행</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  function patchBackBtn(){
    document.querySelectorAll(".back-btn").forEach(function(btn){
      var oc = btn.getAttribute("onclick") || "";
      if(oc.indexOf("showView") !== -1) return;
      btn.setAttribute("onclick", "location.href='asset_manager_mobile.html'");
    });
  }
  function isModalOpen(){
    var sel = [
      ".sheet-overlay.active",".fs-overlay-legacy.active",".category-overlay.active",
      ".amount-overlay.active",".settings-overlay.active",".name-overlay.active",".reset-overlay.active"
    ];
    return sel.some(function(s){ try{ return !!document.querySelector(s); }catch(e){ return false; } });
  }
  function patchSwipe(){
    var sx=0,sy=0;
    document.addEventListener("touchstart",function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
    document.addEventListener("touchend",function(e){
      var dx=e.changedTouches[0].clientX-sx, dy=Math.abs(e.changedTouches[0].clientY-sy);
      if(dx>50 && dy<30 && !isModalOpen()) history.back();
    },{passive:true});
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",function(){ patchBackBtn(); patchSwipe(); });
  else { patchBackBtn(); patchSwipe(); }
})();
</script>
</body>
</html>
